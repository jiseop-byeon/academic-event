# Industry internship watchlist — big tech, industrial research labs, autonomy companies.
# Feeds the daily collector. Every endpoint below was requested once on 2026-10-02.
#
# Fields
#   ats        greenhouse | lever | ashby | workday | amazon | custom
#   board      Greenhouse / Lever / Ashby board token (exact, case-sensitive as listed)
#   workday    {host, tenant, site} -> POST https://<host>/wday/cxs/<tenant>/<site>/jobs
#              body {"searchText": "<query>", "limit": 20, "offset": 0, "appliedFacets": {}};
#              detail: GET https://<host>/wday/cxs/<tenant>/<site><externalPath>
#   endpoint   the exact URL that was tested (public JSON API or HTML page)
#   queries    search terms for search-style endpoints (workday, amazon, custom)
#   browser    true = curl is blocked or the list is JS-rendered; needs a real browser session
#   relevant_now  were relevant (robotics / physical AI / vision / autonomy, MS–PhD) internships open on 2026-10-02
# Rules for the collector: public endpoints only — no login, no forms, never send an e-mail
# address (not in headers, URLs or payloads).
last_checked: 2026-10-02
companies:
  # ---------------- big tech ----------------
  - name: "NVIDIA"
    org_type: bigtech
    careers: "https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite"
    ats: workday
    workday: {host: "nvidia.wd5.myworkdayjobs.com", tenant: "nvidia", site: "NVIDIAExternalCareerSite"}
    endpoint: "https://nvidia.wd5.myworkdayjobs.com/wday/cxs/nvidia/NVIDIAExternalCareerSite/jobs"
    queries: ["PhD Research Intern 2027", "intern robotics", "research intern 2027"]
    relevant_now: true
    note: "2027 박사 연구 인턴 다수 게시(Seattle Robotics Lab, GEAR, ASPIRE, Cosmos, DAIR 등). 상하이·타이베이 공고가 섞여 나오므로 위치 필터 필요."
