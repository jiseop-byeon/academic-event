    queries: ["student researcher", "research intern"]
    relevant_now: true
    note: "DeepMind 채용은 Google Careers로 통합(Greenhouse 'deepmind' 보드는 404). 인턴은 Google 'Student Researcher, PhD' 공고로 DeepMind까지 매칭. HTML에 [\"<id>\",\"<title>\"] 튜플이 들어 있어 파싱 가능, 상세는 /jobs/results/<id>."
