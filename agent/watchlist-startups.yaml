    ats: custom
    endpoint: "https://www.zintellect.com/Opportunity/Details/ORNL-RSI-Spring-2027"
    relevant_now: true
    items: ["ornl-graduate-research-gro-rolling"]
    note: "GRO는 시민권 요건 없음·수시 심사(멘토 선확보, 월 $3,800 + 주거 $1,000). RSI(Spring 2027 마감 2026-10-28)·SCGSR은 미국 시민/영주권자 전용. Summer 2027 RSI 공고는 아직 없음(Zintellect의 ORNL-RSI-Summer-2027 형식 주시). jobs.ornl.gov(SuccessFactors) 'intern' 검색에는 학생 인턴이 없고 학생 과정은 ORISE/Zintellect 경유."
    note_en: "GRO has no citizenship requirement and rolling review (secure a mentor first; $3,800 a month plus $1,000 for housing). RSI (Spring 2027 deadline 2026-10-28) and SCGSR are for US citizens and permanent residents only. No Summer 2027 RSI posting yet (watch for ORNL-RSI-Summer-2027 on Zintellect). The jobs.ornl.gov (SuccessFactors) 'intern' search lists no student internships — student programs go through ORISE/Zintellect."
