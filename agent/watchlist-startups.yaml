# Internship watchlist for the daily collector — robotics / physical-AI startups, construction robotics
# and construction tech, construction firms, and government / national labs.
# Big tech and corporate research labs are tracked separately.
#
# Checked 2026-10-02 without any login or email address: every greenhouse / lever / ashby / workday
# endpoint below (and the Rippling, Gem and Eightfold JSON endpoints) was called once and returned the
# board; custom HTML pages were read once (some by a helper agent in the same session).
#   greenhouse: GET  https://boards-api.greenhouse.io/v1/boards/{token}/jobs?content=true
#   lever:      GET  https://api.lever.co/v0/postings/{token}?mode=json          (token is case-sensitive)
#   ashby:      GET  https://api.ashbyhq.com/posting-api/job-board/{token}?includeCompensation=true
#   workday:    POST https://{host}/wday/cxs/{tenant}/{site}/jobs
#               body {"searchText": "intern", "limit": 20, "offset": 0, "appliedFacets": {}}  (limit max 20;
#               searchText is fuzzy, so filter titles client-side; detail: GET https://{host}/wday/cxs/{tenant}/{site}{externalPath})
#   custom:     see `endpoint` and `note` (HTML pages need a site-specific parser)
#
# relevant_now: a relevant PhD/MS-level robotics, manipulation, physical-AI, perception, navigation,
# HRI, simulation or construction-automation internship was open on 2026-10-02.
# items: data/internships/<id>.yaml files written from this company's postings.
