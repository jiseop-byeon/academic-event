  # --- Government / national labs (lab) ------------------------------------------------------
  - name: "NIST Engineering Laboratory"
    org_type: lab
    careers: "https://www.nist.gov/iaao/academic-affairs-office/prep"
    ats: custom
    endpoint: "https://prep.umd.edu/"
    relevant_now: false
    note: "SURF는 학부생·미국 시민/영주권자 전용(2027년 신청 2027년 1월 말 마감), GMSE 대학원 펠로우십은 미국 시민 전용(매년 8월 말~12월 초 접수). PREP은 파트너 대학(예: UMD 게시판) 경유 채용이며 UT Austin은 파트너 아님. 외국인은 Foreign Guest Researcher(대부분 외부 재원)로만 가능. Intelligent Systems Division에 로봇 파지·조작 연구 공고(PREP0005092, post-master's)가 있음."
    note_en: "SURF is for undergraduates who are US citizens or permanent residents (2027 applications close in late January 2027); the GMSE graduate fellowship is US-citizen only (applications each year from late August to early December). PREP hires through partner universities (e.g., the UMD board), and UT Austin is not a partner. Foreign nationals can join only as Foreign Guest Researchers (mostly externally funded). The Intelligent Systems Division has a robot grasping/manipulation research posting (PREP0005092, post-master's)."
  - name: "Oak Ridge National Laboratory (ORNL)"
    org_type: lab
