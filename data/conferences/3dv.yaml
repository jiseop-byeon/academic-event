  summary: "3D 재구성·SfM/SLAM·뉴럴 렌더링·3D 생성 모델 등을 다루는 3D 비전 전문 단일 트랙 학회로, 방법론 신규성과 정량 평가를 중시하며 8쪽·이중맹검으로 심사한다. 2027년에는 AC가 요청할 때만 짧은 저자 응답을 받는 방식을 시범 도입했고, 예비 통보(10월)와 최종 통보(12월) 두 단계로 결과가 나온다. 건설 포인트클라우드·스캔 기반 BIM 정합 연구는 3D 비전 방법으로서의 일반적 기여가 있을 때만 경쟁력이 있다."
  values: ["3D reconstruction", "geometric rigor", "neural rendering", "single-track"]
