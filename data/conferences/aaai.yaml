    notes: "제41회 AAAI. 본논문(7/28) 마감과 1단계 탈락 통보(9/24)가 지났고, 남은 일정은 author feedback(10/19–25), 최종 결과(11/30), 카메라레디(12/14)다. 아직 열린 기회는 박사과정생 대상 Doctoral Consortium(10/13 AoE 마감, 2쪽 학위논문 요약·2쪽 CV·1쪽 자기소개서)과 워크숍 논문(대부분 11/20 무렵 마감, 워크숍 목록은 10/16까지 공개되며 AAAI 디지털 라이브러리에는 실리지 않음)이다. 학생 초록·포스터(9/28)는 마감됐다."
    notes_en: "41st AAAI. The paper deadline (7/28) and Phase 1 rejections (9/24) are past; author feedback runs 10/19-25, final decisions come 11/30 and camera-ready is due 12/14. Still open: the Doctoral Consortium for PhD students (due October 13, AoE; 2-page thesis summary, 2-page CV, 1-page personal statement) and workshop papers (most due around November 20; the workshop list is posted by October 16, and workshop papers do not go into the AAAI digital library). The student abstract and poster deadline (September 28) has passed."
