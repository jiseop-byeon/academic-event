orientation:
  contribution: -1
  summary: "AI 전 분야를 아우르는 대형 학회로 본문 7쪽+참고문헌 2쪽, 이중 익명 2단계 심사(1단계 2인 리뷰와 결정에 쓰이지 않는 AI 리뷰 → 2단계 추가 리뷰 후 author feedback)를 거치며, 좁은 하위 분야의 점진적 개선보다 새 문제·방향을 여는 방법론적 기여를 선호한다. 설명 가능한 AI(XAI)는 'HAI: Explainable AI for Human Understanding', 'ML: Transparent, Interpretable & Explainable ML', 'PEAI: Accountability, Interpretability & Explainability' 키워드로 정식 범위이고 HRI·인간-AI 협업과 신뢰 키워드도 있어, 응용 도메인에서 설명 방법을 새로 제시하고 정량 평가하면 경쟁력이 있다. 메인 트랙 외에 기법과 사회 문제의 적합성으로 심사하는 AI for Social Impact, mechanistic interpretability를 포함하는 AI Alignment 특별 트랙이 있고, 저자당 10편 투고 제한과 재현성 체크리스트가 있다."
  summary_en: "A large conference spanning all of AI, with 7 pages of content plus 2 of references and a double-blind two-phase review (Phase 1: two reviews plus a non-decisional AI-generated review; Phase 2: more reviews, then author feedback); it prefers methodological contributions that open new problems or directions over incremental gains in a narrow sub-area. Explainable AI (XAI) is formally in scope through the keywords 'HAI: Explainable AI for Human Understanding', 'ML: Transparent, Interpretable & Explainable ML' and 'PEAI: Accountability, Interpretability & Explainability', next to human-robot interaction and human-AI collaboration and trust keywords, so a new explanation method evaluated quantitatively in an application domain can compete. Besides the main track there are special tracks on AI for Social Impact (judged on the fit between technique and a socially important problem) and AI Alignment (including mechanistic interpretability), a cap of 10 submissions per author and a reproducibility checklist."
  values: ["broad AI scope", "methodological novelty", "explainable AI keywords", "two-phase double-blind review", "reproducibility checklist"]
fit: 2
take: "작업자·보행자 의도 예측 모델의 설명 가능성(XAI)을 새 방법으로 정식화하고 정량 평가했을 때 노릴 만한 범용 AI 학회로, XAI 전용 키워드와 AI for Social Impact 트랙이 있지만 AAAI-27 본논문은 마감됐으니 2027년 7월 말(예상) 마감인 AAAI-28을 목표로 하자."
take_en: "A general AI venue worth aiming at once explainability (XAI) for worker or pedestrian intent-prediction models is cast as a new method and evaluated quantitatively; it has dedicated XAI keywords and an AI for Social Impact track, but the AAAI-27 paper deadline has passed, so target AAAI-28 (deadline expected in late July 2027)."
