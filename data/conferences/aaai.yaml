  summary: "AI 전 분야를 아우르는 대형 학회로 본문 7쪽+참고문헌 2쪽, 2단계 심사(1단계 2인 리뷰와 결정에 쓰이지 않는 AI 리뷰 → 2단계 추가 리뷰 후 author feedback)를 거친다. 비전·ML 비중이 크고 로보틱스·인식도 공식 범위지만 핵심 청중은 아니며 방법론적 신규성이 기본이다. 메인 트랙 외에 AI for Social Impact·AI Alignment 특별 트랙과 배포된 AI 응용을 다루는 IAAI-27이 함께 열리고, 저자당 10편 투고 제한이 있다."
  values: ["broad AI scope", "methodological novelty", "two-phase review", "reproducibility checklist"]
fit: 1
take: "범용 AI 학회라 건설 로봇 논문의 1차 타깃으로는 비효율적이며, 7월 말 마감 일정이 맞을 때 ICRA/IROS 탈락 원고의 대안 정도로만 고려하라."
