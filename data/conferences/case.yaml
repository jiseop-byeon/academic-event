id: case
acronym: "CASE"
name: "IEEE International Conference on Automation Science and Engineering"
organizer: "IEEE Robotics and Automation Society (RAS)"
fields: [robotics, construction, manipulation, physical-ai]
community: robotics
tier: 2
rankings:
  h5_index: 30
  h5_year: 2025
frequency: annual
paper_format: "6 pages including references, up to 2 additional pages with an extra page charge (8 max), IEEE two-column"
review:
  blind: double
proceedings: "IEEE Xplore"
journal_track: "Accepted T-ASE, RA-L, T-RO, RA-M and RA-P papers can be presented at CASE as presentation-only papers (CASE 2027 deadline 2027-04-30)"
orientation:
  contribution: 1
  summary: "IEEE RAS 3대 플래그십 중 자동화 쪽 학회로, 제조·물류·건설 등 실제 공정에 로봇과 자동화를 통합하고 정량적으로 검증한 논문을 환영한다. 알고리즘 신규성은 적당해도 되며, 건설 공정 자동화(시공 작업 로봇화, BIM·디지털 트윈 연계 작업 계획)는 'automation in construction' 주제로 자연스럽게 받아들여진다."
  summary_en: "As the automation-side conference among the 3 IEEE RAS flagships, it welcomes papers that integrate robotics and automation into real processes such as manufacturing, logistics and construction and validate them quantitatively. Modest algorithmic novelty is acceptable, and construction process automation (robotizing building tasks, task planning linked to BIM and digital twins) is readily accepted under the 'automation in construction' topic."
  values: ["system integration", "industrial automation", "real-world validation", "optimization"]
fit: 3
take: "CASE 2027(린츠, 3/1 마감)은 건설 공정 자동화 시스템 논문을 ICRA보다 낮은 문턱으로 RAS 플래그십 무대에 올릴 수 있는 현실적 1순위 후보."
take_en: "CASE 2027 (Linz, 3/1 deadline) is the realistic No. 1 candidate: it lets a construction process automation systems paper reach an RAS flagship stage at a lower bar than ICRA."
