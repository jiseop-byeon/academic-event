id: chi
acronym: "CHI"
name: "ACM CHI Conference on Human Factors in Computing Systems"
organizer: "ACM SIGCHI"
fields: [ar, hri, haptics, xai]
community: xr
tier: 1
rankings:
  core: "A*"
  h5_index: 139
  h5_year: 2025
frequency: annual
paper_format: "No page limit: 5,000-8,000 words encouraged, under 5,000 counts as a short paper, over 12,000 desk-rejected unless justified; abstract max 150 words; ACM single-column template for review; anonymized (CHI 2027 rule)"
review:
  blind: double
  rebuttal: true
  acceptance_rate: {value: 0.253, year: 2026, note: "1,705 conditionally accepted of 6,730 completed submissions (official CHI 2026 papers-track statistics)"}
proceedings: "ACM Digital Library, fully open access under ACM Open (CHI 2027 APC: $500 for ACM/SIG members, $750 otherwise, unless the author's institution participates in ACM Open)"
orientation:
  contribution: 1
  summary: "HCI 분야 최대·최고 학회로, 실증 연구, 시스템·인터페이스, 설계, 방법론, 이론 등 어떤 유형이든 독창성·중요성·타당성·연구 품질·명료성을 기준으로 평가한다. 알고리즘의 새로움보다 사람에 대해 무엇을 새로 알게 됐는지와 엄밀한 사용자 연구가 핵심이며, 1차 심사 후 일정 점수 이상이면 수정 후 재투고(revise and resubmit) 기회를 준다. 관련 HCI 문헌에 자리 잡지 못하거나 방법론 설명이 크게 부족하면 데스크 리젝될 수 있다."
  summary_en: "The largest and most prestigious HCI conference; empirical studies, systems and interfaces, design, methods and theory are all judged on originality, significance, validity, research quality and clarity. What counts is what the work reveals about people, backed by rigorous user studies, more than algorithmic novelty; papers above a score threshold after round one get a revise-and-resubmit. Work not situated in the relevant HCI literature, or grossly thin on methodological detail, may be desk-rejected."
  values: ["user studies", "human-centered insight", "revise and resubmit", "broad HCI scope"]
fit: 2
take: "보행자·운전자용 AR 경고나 작업자-로봇 인터페이스를 사람 중심 연구로 깊게 파고들 때만 노릴 곳이니, 2027 본논문은 마감됐으므로 2027년 9월 초(예상) 마감인 CHI 2028(케이프타운)을 염두에 두고 그 전에 1월 21일 포스터 트랙을 활용하자."
take_en: "Worth aiming at only when AR warnings for pedestrians and drivers, or worker-robot interfaces, are studied in depth from a human-centered angle — the 2027 paper deadline has passed, so keep CHI 2028 in Cape Town (deadline expected early September 2027) in mind and use the January 21 poster track first."
