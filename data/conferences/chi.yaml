    notes: "본논문(9/10)과 워크숍 제안(10/1)은 마감됐다. 남은 투고 기회는 1/21 포스터(최대 4쪽)·인터랙티브 데모·학생 연구 경진대회다. 모든 저자에게 심사 의무가 있으며, ORCID가 필수이고 프로필의 DBLP 항목도 채워야 한다(없으면 n/a). 주제는 '다리(bridges)'."
    notes_en: "Papers (September 10) and workshop proposals (October 1) are closed. Still open on January 21: posters (up to 4 pages), interactive demos and the Student Research Competition. Every author must be available to review, must have an ORCID and must fill in the DBLP field of their profile (n/a if none). The theme is 'bridges'."
