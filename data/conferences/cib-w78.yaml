id: cib-w78
acronym: "CIB W78"
name: "International CIB W78 Conference on Information Technology in Construction"
organizer: "CIB W78 – Information Technology for Construction (CIB working commission)"
fields: [construction, ml, robotics]
community: construction
tier: 3
frequency: annual
paper_format: "Abstract first, then full paper (2026); in 2027 submissions run through the joint EC3 system (8-page full papers)"
orientation:
  contribution: 1
  summary: "BIM·데이터 통합·디지털 트윈·AI 등 건설 IT 전반을 다루는 오래된 CIB 워킹커미션 학회다. 정보 모델링·데이터 관리 관점의 응용 연구가 주류이고, 로봇은 'Smart Manufacturing and Robotic Construction' 주제로 일부 다뤄진다. 해마다 EC3·buildingSMART 서밋 등과 공동 개최되는 경우가 많다."
  values: ["construction IT", "BIM & data integration", "abstract-first", "co-located events"]
fit: 1
take: "로봇 조작 연구의 주 무대는 아니므로 단독 투고보다는 2027년 EC3와 공동 개최(테살로니키)될 때 EC3 투고로 함께 노출하는 정도가 적당하다."
