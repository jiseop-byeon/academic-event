orientation:
  contribution: 2
  summary: "VR/AR·디지털 트윈·BIM 등 가상현실 기술의 건설 적용을 다루는 소규모 연례 학회다. 프로토타입·사례 적용 수준의 응용 논문으로 충분하며, 영역 의장이 2인 이상 심사자를 배정해 품질 순위를 매긴다. 최근에는 ICIO·SASBE 등 다른 행사와 공동 개최되는 경우가 많다."
