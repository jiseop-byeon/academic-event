id: corl
acronym: "CoRL"
name: "Conference on Robot Learning"
organizer: "Robot Learning Foundation"
fields: [physical-ai, robotics, manipulation, ml, navigation]
community: robotics
tier: 1
rankings:
  h5_index: 107
  h5_year: 2025
frequency: annual
paper_format: "8 pages of main text at submission (9 for camera-ready); acknowledgments, references and appendix not counted; mandatory limitations section"
review:
  blind: double
  rebuttal: true
proceedings: "Proceedings of Machine Learning Research (PMLR)"
orientation:
  contribution: -1
  summary: "로봇 학습(모방·강화학습, VLA, 로봇 foundation model) 중심의 단일 트랙 학회로, 학습 기반 방법의 새로움과 실로봇 검증을 동시에 요구한다. 고전 제어나 시스템 통합만으로는 범위 밖으로 보이기 쉽고, 건설 작업은 '새로운 contact-rich 과제·데이터 + 학습 정책의 일반화'로 제시해야 관심을 끈다. rebuttal은 1쪽, 사실 오류 지적에 한정된다."
  summary_en: "A single-track conference centered on robot learning (imitation and reinforcement learning, VLA, robot foundation models) that demands both novelty in learning-based methods and real-robot validation. Classical control or systems integration alone tends to look out of scope, and construction work only draws interest when framed as 'a new contact-rich task and data + generalization of a learned policy'. The rebuttal is limited to 1 page and to pointing out factual errors."
  values: ["robot learning", "real-robot validation", "generalization", "open-source"]
fit: 3
take: "CoRL 2026은 오스틴(UT 홈그라운드)에서 11월에 열리니 청강·네트워킹은 필수이고, 투고는 2027년 5월 말 예상 마감에 학습 기반 건설 조작 결과로 노릴 것."
take_en: "CoRL 2026 is held in Austin (UT's home turf) in November, so attending and networking are a must; for submission, aim at the expected late-May 2027 deadline with learning-based construction manipulation results."
