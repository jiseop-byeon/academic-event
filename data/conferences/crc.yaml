id: crc
acronym: "CRC"
name: "ASCE Construction Research Congress"
organizer: "ASCE Construction Institute (CI) and Construction Research Council"
fields: [construction, robotics, vision]
community: construction
tier: 2
frequency: biennial
paper_format: "Abstract (about 200 words) first, then full paper up to 10 pages (2026)"
proceedings: "ASCE Library (CRC proceedings, multiple volumes)"
orientation:
  contribution: 2
  summary: "미국 건설공학·관리(CEM) 연구자들의 대표 학회로, 초록 심사 → 풀페이퍼 심사 → 카메라레디 순의 초록 선행 방식이다. 사례 연구·설문·현장 적용 같은 응용 논문이 주류이고 'Automation in Construction' 트랙이 따로 있어 로봇 연구도 받지만, 청중은 관리·안전·교육 쪽 비중이 크다. 등록 1건당 논문 2편까지 게재된다."
  summary_en: "The flagship conference of US construction engineering and management (CEM) researchers, run abstract-first: abstract review, then full-paper review, then camera-ready. Applied papers such as case studies, surveys and field applications dominate; there is a separate 'Automation in Construction' track, so robotics work is accepted too, but the audience leans toward management, safety and education. Up to 2 papers are published per registration."
  values: ["application papers", "abstract-first", "US CEM community", "student-friendly"]
fit: 2
take: "2027년에는 CRC 대신 ASCE2027이 열리고 다음 CRC는 2028년이 유력하니, 당장은 i3CE·ISARC를 우선하고 CRC는 2027년 상반기 초록 공지를 지켜보며 미국 CEM 네트워킹용으로 활용하자."
take_en: "ASCE2027 replaces CRC in 2027 and the next CRC is most likely in 2028, so put i3CE and ISARC first for now and use CRC for US CEM networking, watching for its abstract call in the first half of 2027."
editions:
  - year: 2028
    status: estimated
    notes: "CRC는 2020·2022·2024·2026 짝수 해에 열린 격년 대회(2026: 3/18–21 샌안토니오, CI와 공동 개최). 2027년에는 ASCE 9개 연구소가 함께하는 ASCE2027(필라델피아, 2027-03-01~05, CI Summit 2027 포함)이 열리며 별도 CRC 2027 공지는 없음. 2028년 개최지·일정은 미발표. 과거 초록 마감은 2023-01-25(CRC 2024)와 2025-04-21(CRC 2026, 5/2로 연장), 풀페이퍼는 2023-05-01과 2025-09-21로 편차가 커서 날짜 추정은 생략 — 2027년 1–4월 공지 확인 필요."
    notes_en: "CRC is a biennial conference held in the even years 2020, 2022, 2024 and 2026 (2026: 3/18–21, San Antonio, held jointly with CI). In 2027, ASCE2027 (Philadelphia, 2027-03-01~05, including CI Summit 2027), which brings together 9 ASCE institutes, is held instead, and no separate CRC 2027 has been announced. The 2028 location and schedule have not been announced. Past abstract deadlines were 2023-01-25 (CRC 2024) and 2025-04-21 (CRC 2026, extended to 5/2), and full-paper deadlines were 2023-05-01 and 2025-09-21; because the spread is large, no date estimate is given — announcements need to be checked in January–April 2027."
