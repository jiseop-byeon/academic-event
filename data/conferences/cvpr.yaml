    notes: "2026-11-26 기준 공식 CVPR·CVF 사이트에 2028년 정보 없음. 개최지·일정(샌안토니오, 6/11–15)은 행사 목록 사이트(BERI, Showsbee)에만 나와 확인되지 않았다. 마감은 CVPR 2025(등록 2024-11-07, 본문 11/14, 태평양시)·2026(초록 2025-11-07, 본문 11/13)·2027(초록 2026-11-10, 본문 11/16) 패턴으로 11월 중순을 추정했다."
