  summary: "컴퓨터 비전 최상위 학회로, 새로운 방법론과 공개 벤치마크에서의 정량적 우위, 철저한 ablation을 가장 높이 산다. 별도의 응용·데이터셋 트랙이 없어 건설 현장 인식 논문도 같은 기준으로 심사되므로 '건설에 적용했다'만으로는 novelty 부족·baseline 비교 부족 지적을 받기 쉽고, 새 데이터셋·벤치마크라면 규모와 일반화 가능한 문제 정의가 필요하다."
  values: ["methodological novelty", "SOTA benchmark results", "large-scale datasets", "thorough ablations"]
fit: 2
take: "조작이 핵심인 지금 1순위 타깃은 아니지만, 건설 현장 인식 데이터셋·벤치마크를 일반화 가능한 방법과 묶어 낼 수 있다면 2026-11-16 마감에 도전할 가치가 있다."
