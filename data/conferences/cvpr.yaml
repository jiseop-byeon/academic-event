proceedings: "CVF Open Access and IEEE Xplore"
attendance: "~12,200 registrants (2026)"
orientation:
  contribution: -1
  summary: "컴퓨터 비전 최상위 학회로, 새로운 방법론과 공개 벤치마크에서의 정량적 우위, 철저한 ablation을 가장 높이 산다. 별도의 응용·데이터셋 트랙이 없어 건설 현장 인식 논문도 같은 기준으로 심사되므로 '건설에 적용했다'만으로는 novelty 부족·baseline 비교 부족 지적을 받기 쉽고, 새 데이터셋·벤치마크라면 규모와 일반화 가능한 문제 정의가 필요하다."
  summary_en: "The top computer vision conference, it values most a new methodology, a quantitative edge on public benchmarks, and thorough ablations. With no separate application or dataset track, construction-site perception papers are reviewed by the same standard, so 'we applied it to construction' alone easily draws comments about insufficient novelty and baseline comparisons; a new dataset or benchmark needs scale and a problem definition that generalizes."
  values: ["methodological novelty", "SOTA benchmark results", "large-scale datasets", "thorough ablations"]
fit: 2
take: "조작이 핵심인 지금 1순위 타깃은 아니지만, 건설 현장 인식 데이터셋·벤치마크를 일반화 가능한 방법과 묶어 낼 수 있다면 CVPR 2028의 2027년 11월 중순(예상) 마감에 도전할 가치가 있다."
take_en: "Not the No. 1 target now that manipulation is the core focus, but worth a shot at the CVPR 2028 deadline expected in mid-November 2027 if a construction-site perception dataset or benchmark can be paired with a generalizable method."
