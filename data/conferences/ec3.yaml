    notes: "CIB W78 컨퍼런스와 공동 개최하며 EC³ 서머스쿨이 7/5–9에 열림. 초록은 선택 사항이라 풀페이퍼만으로도 투고 가능. 첫 판정일·얼리버드 마감이 Key Dates 페이지(3/12, 4/9)와 2027 메인 페이지(3/5, 4/16)에서 다르게 표기돼 Key Dates 페이지 값을 기록함."
