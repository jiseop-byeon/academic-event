id: eg-ice
acronym: "EG-ICE"
name: "EG-ICE International Workshop on Intelligent Computing in Engineering"
organizer: "European Group for Intelligent Computing in Engineering (EG-ICE)"
fields: [construction, vision, ml]
community: construction
tier: 2
frequency: annual
paper_format: "Abstract first, then full paper (max 10 pages in 2025)"
proceedings: "Workshop proceedings (Google Scholar-indexed in 2025)"
journal_track: "Selected papers invited to an Advanced Engineering Informatics special issue"
orientation:
  contribution: 1
  summary: "유럽 중심의 소규모 단일 트랙 워크숍으로 AI·컴퓨터 비전·BIM/온톨로지·VR 등 지능형 컴퓨팅을 공학 문제에 적용한 연구를 다룬다. 세션마다 토론 시간이 길고, 방법론적 아이디어와 공학적 검증의 균형을 본다. 우수 논문이 AEI 특집호로 이어지는 것이 가장 큰 장점이다."
  values: ["intelligent computing", "single-track discussion", "AEI special issue", "European network"]
fit: 2
take: "인지·AI 쪽 결과를 AEI 특집호까지 연결할 수 있는 좋은 징검다리이니, 로봇 조작 본류보다는 비전·디지털 트윈 서브 결과가 나올 때 노려보자."
