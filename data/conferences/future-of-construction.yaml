id: future-of-construction
acronym: "FoC Workshop"
name: "Workshop on Future of Construction (construction robotics workshop at IEEE ICRA / IROS)"
organizer: "Organizers from Mississippi State Univ., Georgia Tech, North Dakota State Univ., NYU and Univ. of Oxford, held at IEEE ICRA / IROS"
fields: [construction, robotics, manipulation, navigation, hri, vision]
community: robotics
tier: 3
frequency: annual
paper_format: "Extended abstract of about 3–4 pages in IEEE conference format, optional 2–3 min video; separate poster-only track"
proceedings: "Accepted papers posted on the workshop website (non-archival)"
journal_track: "Authors of selected papers invited to a special collection of the ASCE Journal of Computing in Civil Engineering (2026)"
orientation:
  contribution: 1
  summary: "ICRA/IROS에서 매년 열리는 건설 로보틱스 전문 반일 워크숍으로, 건설 현장의 인지·내비게이션·조작·인간-로봇 협업 연구를 3–4쪽 확장 초록과 포스터로 받는다. 기존 발표 연구도 포스터 트랙으로 낼 수 있어 부담이 적고, Hilti 챌린지·포스터 상금 등 산업 연계가 강하다."
  values: ["construction robotics", "extended abstracts", "poster track", "industry challenge"]
fit: 3
take: "로봇 커뮤니티 한가운데서 건설 조작 연구를 알릴 수 있는 가장 직접적인 자리이니, 2027년 ICRA/IROS 워크숍 공지가 뜨면 확장 초록이나 포스터를 꼭 내자."
editions:
  - year: 2027
    status: estimated
    notes: "1회 ICRA 2022, 2회 ICRA 2023(런던), 3회 ICRA 2024(요코하마), 4회 ICRA 2025(애틀랜타), 5회 IROS 2026(피츠버그, 9/27)으로 매년 개최. 2027년 개최 학회(ICRA 또는 IROS)와 일정은 미발표. 투고 마감은 보통 워크숍 4–6주 전(2025: 4/18, 2026: 8/31, AoE)이고 OpenReview로 받음."
