orientation:
  contribution: 0
  summary: "HRI 분야 최상위 학회로, 엄밀한 사용자 연구(통계·연구윤리 절차)와 인간 중심 설계 기여를 가장 높이 산다. 건설 현장의 작업자-로봇 협업(신뢰, 안전, 작업 분담)을 실제 작업자 대상 실험으로 보이면 독특한 응용으로 환영받지만, 사용자 연구 없이 로봇 성능만 보이면 범위 밖으로 판단된다."
  values: ["user studies", "human-centered design", "statistical rigor", "interdisciplinary"]
fit: 2
take: "HRI는 작업자-로봇 협업을 실제 사용자 실험으로 다룰 때만 노릴 2순위 — 2027 본논문은 마감됐으니 12/8 Late-Breaking Report로 초기 결과를 내 보는 것이 현실적."
