paper_format: "Regular and organized-session papers 1-6 pages; late result papers 1-2 pages (poster only)"
proceedings: "Conference proceedings; regular/organized-session papers of 3+ pages optionally indexed in IEEE Xplore, Scopus and EI Compendex"
orientation:
  contribution: 1
  summary: "제어로봇시스템학회(ICROS)의 국제학회로 제어·자동화·로봇·시스템 전반을 넓게 다루며(연 450–550편), 짧은 논문과 시스템 결과도 받아들여 채택 문턱이 낮다. 건설 로봇의 제어·인식 결과를 빠르게 공개하고 국내 제어·로봇 연구자와 교류하는 용도로 적합하나, 학계에서의 가시성은 제한적이다."
  values: ["control and automation", "broad scope", "Korean community"]
fit: 1
take: "ICCAS는 범위가 넓고 문턱이 낮은 지역 학회라 우선순위가 낮다 — 다른 목표 학회와 일정이 겹치지 않을 때 보조 발표용으로만 고려할 것."
