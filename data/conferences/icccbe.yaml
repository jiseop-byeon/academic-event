id: icccbe
acronym: "ICCCBE"
name: "International Conference on Computing in Civil and Building Engineering"
organizer: "International Society for Computing in Civil and Building Engineering (ISCCBE)"
fields: [construction, robotics, vision, ml, hri]
community: construction
tier: 2
frequency: biennial
paper_format: "Full paper 8 pages or short paper 4 pages; abstract submission optional (2026)"
orientation:
  contribution: 1
  summary: "1981년부터 이어진 ISCCBE의 격년 국제학회로 AI, BIM·디지털 트윈, 리얼리티 캡처, 로보틱스·자동화, 인간 중심 기술 등 토목·건축 컴퓨팅 전반을 다룬다. 2026년 대회는 초록 없이 4쪽·8쪽 논문을 바로 받았고 산업 적용 사례 트랙도 있어 진입 장벽이 낮다."
  values: ["computing in civil engineering", "biennial international", "short or full papers", "industry applications track"]
fit: 2
take: "격년 대회라 다음 기회는 2028년이므로, 그 전까지는 i3CE·ISARC를 우선하고 2028년 개최지 공지가 나오면 국제 네트워킹용으로 고려하자."
editions:
  - year: 2028
    status: estimated
    notes: "ICCCBE는 격년 개최(2022 케이프타운, 2024 몬트리올, 2026 타이베이 3/23–26). 2026-10-02 기준 ISCCBE 사이트에 2028년 개최지·일정 미발표. 개최 시기가 회차마다 달라 마감 추정은 생략(2026 대회는 논문 마감 2025-10-15, 채택 통보 2026-01-01이었음)."
