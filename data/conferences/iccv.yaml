    city: "Hong Kong"
    country: HK
    venue: "Hong Kong Convention and Exhibition Centre (HKCEC)"
    lat: 22.30
    lon: 114.17
    url: "https://iccv.thecvf.com/Conferences/2027"
    deadlines:
      - {kind: abstract, date: 2027-03-01, label: "Paper registration", estimated: true}
      - {kind: paper, date: 2027-03-05, estimated: true}
    notes: "공식 마감일은 아직 미발표. ICCV 2023(3/8)·2025(3/7) 제출 마감 패턴으로 3월 첫 주를 추정했으며, 2027년은 10월 초 개최라 더 앞당겨질 수 있다. 공식 Dates 페이지는 아직 이전 대회 템플릿 상태다."
    notes_en: "The official deadline has not been announced yet. The first week of March is estimated from the ICCV 2023 (3/8) and 2025 (3/7) submission deadline pattern, and since the 2027 conference is held in early October, the deadline could come earlier still. The official Dates page is still showing the previous conference's template."
