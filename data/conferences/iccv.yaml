id: iccv
acronym: "ICCV"
name: "IEEE/CVF International Conference on Computer Vision"
organizer: "IEEE Computer Society & Computer Vision Foundation (CVF)"
fields: [vision, ml]
community: vision
tier: 1
rankings:
  core: "A*"
  h5_index: 256
  h5_year: 2025
frequency: biennial
paper_format: "8 pages excluding references (ICCV template); optional 1-page rebuttal PDF (2025 rules)"
review:
  blind: double
  rebuttal: true
  acceptance_rate: {value: 0.24, year: 2025, note: "2,698 of 11,239 submissions"}
proceedings: "CVF Open Access and IEEE Xplore"
orientation:
  contribution: -1
  summary: "CVPR과 같은 CVF 규정(8쪽+참고문헌, 이중맹검, 1쪽 rebuttal)으로 운영되는 격년(홀수 해) 최상위 비전 학회로, 평가 기준도 CVPR과 사실상 같아 방법론적 신규성과 강한 정량 실험이 핵심이다. 응용 트랙이 없어 건설 현장 인식 논문은 일반적인 비전 문제로서의 기여를 분명히 보여야 한다."
  summary_en: "A top vision conference held biennially (in odd years) under the same CVF rules as CVPR (8 pages plus references, double-blind, 1-page rebuttal); its evaluation criteria are effectively the same as CVPR's, so methodological novelty and strong quantitative experiments are what count. With no application track, construction-site perception papers must clearly show a contribution as a general vision problem."
  values: ["methodological novelty", "strong quantitative results", "thorough ablations"]
fit: 2
take: "마감이 2027년 3월 초(추정)라 CVPR 2027 결과(2027-02-25)를 받은 뒤 리뷰를 반영해 재투고하기 좋은 일정이므로, 인식 파트 논문이 있다면 홍콩 대회를 계획에 넣어라."
take_en: "The deadline is in early March 2027 (estimated), a schedule that suits resubmitting after receiving the CVPR 2027 result (2027-02-25) and incorporating the reviews, so if you have a perception paper, put the Hong Kong conference in your plan."
