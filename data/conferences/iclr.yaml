organizer: "ICLR Board"
fields: [ml, physical-ai, xai]
community: ml
tier: 1
rankings:
  core: "A*"
  h5_index: 362
  h5_year: 2025
frequency: annual
paper_format: "9 pages main text at submission; references and appendix unlimited (2027 rules)"
review:
  blind: double
  rebuttal: true
  acceptance_rate: {value: 0.274, year: 2026, note: "5,355 of 19,525 valid submissions"}
proceedings: "OpenReview (ICLR proceedings)"
journal_track: "TMLR papers with a J2C Certification can be presented in the NeurIPS/ICML/ICLR Journal-to-Conference track"
orientation:
  contribution: -2
  summary: "딥러닝·표현학습 방법론 중심 학회로 리뷰와 저자-리뷰어 토론이 OpenReview에 모두 공개되고(거절·철회 논문도 공개 유지), 새로운 방법과 엄밀한 ablation이 핵심이다. 로봇 학습(정책 학습, world model 등) 논문은 ML 전반에 통하는 통찰이 있어야 하고 건설 응용 자체는 가산점이 거의 없다. 2027년부터 저자당 20편 제한과 함께, 리뷰어 자격이 있는 공저자가 한 명도 없는 논문은 저자 1인당 1편까지만 허용된다."
  summary_en: "A conference centered on deep learning and representation learning methodology, where reviews and author-reviewer discussions are all public on OpenReview (kept public even for rejected or withdrawn papers), and new methods and rigorous ablations are what matter. Robot learning papers (policy learning, world models, etc.) need insights that carry over to ML in general, and a construction application earns almost no bonus points by itself. From 2027, in addition to the limit of 20 papers per author, papers with no reviewer-eligible co-author are limited to 1 paper per author."
  values: ["representation learning", "methodological novelty", "open review", "thorough ablations"]
fit: 1
take: "로봇 학습 방법에 일반적인 ML 통찰이 있을 때만 도전할 곳이며, 첫 투고라면 리뷰어 자격이 있는 지도교수·선배를 공저자로 넣어야 편수 제한에 걸리지 않는다."
take_en: "Worth attempting only when a robot learning method carries general ML insight, and for a first submission, include a reviewer-eligible advisor or senior colleague as a co-author so as not to run into the paper-count limit."
