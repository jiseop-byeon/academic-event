id: icra
acronym: "ICRA"
name: "IEEE International Conference on Robotics and Automation"
organizer: "IEEE Robotics and Automation Society (RAS)"
fields: [robotics, manipulation, navigation, physical-ai, vision]
community: robotics
tier: 1
rankings:
  core: "A*"
  h5_index: 129
  h5_year: 2025
frequency: annual
paper_format: "8 pages for the complete paper including references, IEEE two-column (ICRA 2027 rule); optional video up to 180 s"
review:
  blind: double
  rebuttal: false
  acceptance_rate: {value: 0.38, year: 2025, note: "1,606 accepted of 4,250 submissions (official ICRA 2025 highlight statistics)"}
proceedings: "IEEE Xplore"
journal_track: "Accepted RA-L, T-RO, T-ASE, RA-M, T-RL, T-FR, RA-P and ToH papers can be presented at ICRA 2027 (journal transfer deadline 2026-12-31); papers rejected from IROS 2026 could resubmit through the 'IROS-ICRA transfer' category with an author response file"
attendance: "~7,000 (2025)"
orientation:
  contribution: 0
  summary: "로봇공학 전 분야를 아우르는 세계 최대 로봇 학회로, 새로운 방법과 완성도 높은 시스템을 모두 받되 실제 로봇 실험과 명확한 baseline 비교를 강하게 요구한다. 건설 작업(드릴링·체결·패널 설치 등)을 일반적인 contact-rich manipulation 문제로 정식화하고 실로봇으로 검증하면 무난히 받아들여지지만, 시뮬레이션만 있거나 단순 통합 데모 수준이면 'novelty 부족' 지적을 받기 쉽다."
  summary_en: "The world's largest robotics conference, spanning all of robotics; it accepts both new methods and polished systems but strongly demands real-robot experiments and clear baseline comparisons. If a construction task (drilling, fastening, panel installation, etc.) is formalized as a general contact-rich manipulation problem and validated on a real robot, it is accepted without much trouble, but simulation-only work or a simple integration demo easily draws a 'lack of novelty' comment."
  values: ["real-robot experiments", "broad scope", "clear baselines", "video demos"]
fit: 3
take: "ICRA는 매년 9월 중순 마감의 기본 목표 — 2027(서울)은 이미 마감됐으니 2028(리우, 2027년 9월 중순 마감 예상)을 건설 contact-rich 조작 1저자 논문의 주 타깃으로 잡을 것."
take_en: "ICRA is the default target, with a deadline in mid-September every year; 2027 (Seoul) has already closed, so make 2028 (Rio, deadline expected in mid-September 2027) the main target for a first-author paper on construction contact-rich manipulation."
editions:
  - year: 2027
    status: confirmed
    start: 2027-05-24
    end: 2027-05-28
    city: "Seoul"
    country: KR
    venue: "COEX"
    lat: 37.57
    lon: 126.98
    url: "https://2027.ieee-icra.org/"
    deadlines:
      - {kind: paper, date: 2026-09-16, tz: "PT", time: "23:59", label: "extended from Sep 15"}
      - {kind: supplementary, date: 2026-09-22, tz: "PT", time: "23:59", label: "accompanying video, second window"}
      - {kind: workshop-proposal, date: 2026-11-02, label: "full workshop/tutorial proposal"}
      - {kind: other, date: 2026-12-31, label: "journal paper transfer (RA-L, T-RO, T-ASE, ...)"}
      - {kind: notification, date: 2027-01-31}
      - {kind: registration, date: 2027-03-05, label: "author registration"}
    notes: "논문 마감(9/16, 하루 연장)은 종료 — 이제 2027 참여는 RA-L 등 RAS 저널 경유 발표(12/31까지 이관)나 워크숍·튜토리얼 제안(11/2)으로만 가능하다. 페이지 제한은 참고문헌 포함 8쪽이며 온라인 발표 옵션 없음. 서울 COEX 개최라 국내 연구자 네트워킹에 유리."
    notes_en: "The paper deadline (9/16, extended by one day) has passed — participation in 2027 is now possible only through presentation via RAS journals such as RA-L (transfer until 12/31) or a workshop/tutorial proposal (11/2). The page limit is 8 pages including references, and there is no online presentation option. Being held at COEX in Seoul is advantageous for networking with researchers in Korea."
  - year: 2028
    status: announced
    start: 2028-05-15
    end: 2028-05-19
    city: "Rio de Janeiro"
    country: BR
    lat: -22.91
    lon: -43.17
    deadlines:
      - {kind: paper, date: 2027-09-15, tz: "PT", estimated: true}
      - {kind: notification, date: 2028-01-31, estimated: true}
    notes: "IEEE RAS 공식 ICRA venue 목록 기준 리우데자네이루 개최(5/15–19). 마감·통지일은 최근 회차 패턴(9월 중순 PT 마감, 1/31 통지)으로 추정한 값."
    notes_en: "Held in Rio de Janeiro (5/15–19) according to the official IEEE RAS ICRA venue list. The deadline and notification dates are values estimated from the pattern of recent editions (mid-September PT deadline, 1/31 notification)."
