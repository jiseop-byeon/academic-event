id: ieeevr
acronym: "IEEE VR"
name: "IEEE Conference on Virtual Reality and 3D User Interfaces"
organizer: "IEEE, IEEE Computer Society and IEEE Visualization and Graphics Technical Community (VGTC)"
fields: [ar, haptics, hri]
community: xr
tier: 1
rankings:
  core: "A*"
  h5_index: 52
  h5_year: 2025
frequency: annual
paper_format: "4-9 pages of text, figures and tables (appendices count) plus at most 2 pages of references, IEEE VGTC conference format; double-blind; videos encouraged (IEEE VR 2027 rule)"
review:
  blind: double
  rebuttal: false
proceedings: "IEEE Xplore: top papers in a special issue of IEEE TVCG, the rest in the IEEE VR proceedings"
journal_track: "A single unified review decides between an IEEE TVCG special-issue paper and a conference-only paper; conditionally accepted papers get one revision checked by their coordinator"
orientation:
  contribution: 0
  summary: "VR·AR·MR과 3D 사용자 인터페이스 분야 최고 학회로, 방법론·기술·응용·시스템 네 범주 중 어느 기여든 받지만 모든 논문에 사용자 연구나 벤치마크 같은 평가를 요구한다. 응용 논문은 기존 아이디어를 새 문제에 어떻게 적용했는지와 그 효과를, 시스템 논문은 통합 과정의 교훈을 보여야 한다. VR/AR 문헌과의 연결이 약한 순수 비전·그래픽스 논문은 데스크 리젝될 수 있으며, 반박 없이 조건부 채택 후 수정본 확인으로 끝난다."
  summary_en: "The top venue for VR, AR, MR and 3D user interfaces; it accepts methodological, technical, application or system contributions, but every paper must be evaluated through user studies or benchmarks. Application papers must show how existing ideas solve a new problem and how well; system papers must share lessons from integration. Pure vision or graphics papers with little engagement with VR/AR literature may be desk-rejected, and there is no rebuttal: conditional acceptance is followed by one checked revision."
  values: ["user studies", "3D user interfaces", "TVCG journal track", "evaluation required"]
fit: 2
take: "2027 본논문 마감은 지났으니 건설 로봇 VR 원격조작 인터페이스나 AR 안전 경고를 사용자 실험으로 검증해 2028 대회(2027년 9월 초 마감 예상)를 노리고, 그 전에 12월 포스터·데모 트랙으로 먼저 선보이자."
take_en: "The 2027 paper deadline has passed, so validate a VR teleoperation interface for construction robots or AR safety warnings with user studies for the 2028 conference (deadline expected in early September 2027), and show early results in the December poster or demo track first."
