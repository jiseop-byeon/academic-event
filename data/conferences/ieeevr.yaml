    notes: "본논문(8/31)과 워크숍 제안(9/28)은 마감됐다. 남은 기회는 포스터(12/2 초록, 12/7 2쪽 확장 초록, 익명 심사), 연구 데모(12/7), 3DUI 콘테스트(12/16)다. 2026년부터 떨어진 논문을 포스터로 자동 전환하지 않으며, 박사 학위가 있는 공저자는 모두 심사에 참여해야 한다. 워크숍은 2/27–28에 열린다."
    notes_en: "Papers (August 31) and workshop proposals (September 28) are closed. Still open: posters (abstract December 2, two-page extended abstract December 7, anonymized), research demos (December 7) and the 3DUI Contest (December 16). Since 2026 rejected papers are no longer moved to posters automatically, and every PhD-holding co-author must review. Workshops run February 27-28."
