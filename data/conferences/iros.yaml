proceedings: "IEEE Xplore"
journal_track: "No joint RA-L+IROS submission since IROS 2026; published RA-M papers and non-evolutionary RA-L, T-ASE and T-RO papers can be presented within an eligibility window. Papers rejected from ICRA can resubmit via the 'ICRA-IROS transfer' category with an author response file."
orientation:
  contribution: 0
  summary: "ICRA와 함께 로봇공학 양대 플래그십으로 심사 기준도 거의 같다(새 방법과 시스템 모두 수용, 실로봇 검증 중시). 3월 초 마감이라 ICRA(9월)와 반년 간격의 두 번째 기회가 되며, ICRA 탈락 논문을 리뷰 대응서와 함께 재투고하는 'ICRA-IROS transfer' 트랙이 있다. 건설 로봇 논문은 field·construction robotics 세션에서 무난히 받아들여지나, 현장 특수성을 넘어 일반화 가능한 방법론 기여를 분명히 해야 한다."
  values: ["real-robot experiments", "broad scope", "methods and systems"]
fit: 3
take: "IROS 2027(피렌체)은 3/1 마감 — ICRA 2027을 놓친 지금, 건설 contact-rich 조작 첫 1저자 논문을 겨냥할 가장 가까운 플래그십이다."
