id: iros
acronym: "IROS"
name: "IEEE/RSJ International Conference on Intelligent Robots and Systems"
organizer: "IEEE Robotics and Automation Society (RAS) and Robotics Society of Japan (RSJ)"
fields: [robotics, manipulation, navigation, physical-ai, hri]
community: robotics
tier: 1
rankings:
  core: "A"
