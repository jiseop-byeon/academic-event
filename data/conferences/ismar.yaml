    notes: "제25회 ISMAR. 논문 216편, 포스터 126편, 워크숍 22개 규모로 열리며 모든 마감이 지났다. 2026년부터 반박 1회의 단일 심사로 바뀌었고 논문을 포스터로 바로 돌리는 옵션은 없어졌다. 직후 10/10–11 같은 도시에서 ACM SUI 2026이 열린다."
    notes_en: "The 25th ISMAR, with 216 papers, 126 posters and 22 workshops; every deadline has passed. From 2026 review is a single cycle with one rebuttal, and papers can no longer be redirected straight to posters. ACM SUI 2026 follows in the same city on October 10-11."
  - year: 2027
