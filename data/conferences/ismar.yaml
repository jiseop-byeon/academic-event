    city: "Kobe"
    country: JP
    lat: 34.69
    lon: 135.20
    url: "https://www.ieeeismar.net/2027/"
    deadlines:
      - {kind: abstract, date: 2027-03-08, tz: "AoE", estimated: true}
      - {kind: paper, date: 2027-03-15, tz: "AoE", estimated: true}
    notes: "고베 개최는 공식 발표됐지만 일정·장소·마감은 아직 미정이다. 마감은 직전 두 회차(2025년 4/11, 2026년 3/16, 초록은 1주 전)를 보고 2026년 패턴으로 추정했으며 4월 초까지 늦춰질 수 있다."
    notes_en: "Kobe is officially announced, but dates, venue and deadlines are not. The deadlines follow the 2026 pattern (the last two cycles closed April 11, 2025 and March 16, 2026, with abstracts a week earlier) and could slip to early April."
