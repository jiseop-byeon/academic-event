id: ismar
acronym: "ISMAR"
name: "IEEE International Symposium on Mixed and Augmented Reality"
organizer: "IEEE Computer Society"
fields: [ar, vision, navigation]
community: xr
tier: 1
rankings:
  core: "A*"
  h5_index: 37
  h5_year: 2025
frequency: annual
paper_format: "Main body 4-9 pages, at most 11 pages including references (review papers may add one page of references), IEEE VGTC conference style, anonymized (ISMAR 2026 rule)"
review:
  blind: double
  rebuttal: true
proceedings: "IEEE Xplore: journal-track papers in a special issue of IEEE TVCG, conference papers in the ISMAR proceedings"
journal_track: "A single unified review decides whether an accepted paper becomes an IEEE TVCG special-issue journal paper or an ISMAR conference paper"
orientation:
  contribution: 0
  summary: "AR·MR·VR 분야 최고 학회로, 추적·정합·센서 융합·디스플레이 같은 핵심 기술부터 상호작용, 인지, 응용까지 폭넓게 다룬다. 심사 지침은 이론·방법·엔지니어링·설계·평가 중 어느 쪽이든 분명하고 강한 기여를 요구하며, 응용 논문은 단순한 소프트웨어 구현이 아니라 구체적인 대상 분야의 사용 사례와 그에 맞는 평가를 갖춰야 한다. 한 번의 통합 심사(반박 포함)로 TVCG 저널 논문과 학회 논문을 함께 가린다."
  summary_en: "The top AR/MR/VR conference, spanning core technology such as tracking, registration, sensor fusion and displays as well as interaction, perception and applications. Reviewers look for a clear, strong contribution in theory, methods, engineering, design or evaluation; application papers need a concrete use case in a target domain and a fitting evaluation, not just a software implementation. One unified review with a rebuttal decides between TVCG journal papers and conference papers."
  values: ["user studies", "tracking and registration", "TVCG journal track", "applications with a concrete domain"]
fit: 2
take: "노변 LiDAR 기반 AR 충돌 경고나 건설 현장 AR 인터페이스를 사용자 실험으로 검증하면 노릴 AR 최고 학회이니, 2027년 고베 대회의 3월 중순(예상) 마감을 목표로 삼자."
take_en: "The top AR venue to aim at once the roadside-LiDAR AR collision warnings or a construction-site AR interface are validated with user studies — target the Kobe 2027 deadline, expected in mid-March."
