    notes: "논문 마감 종료. 약 40편 단일 트랙, 참석 인원 제한(저자·초청자 우선). arXiv 공개는 허용되나 타 학회·저널 동시 투고 금지."
    notes_en: "Paper deadline has passed. A single track of about 40 papers, with limited attendance (authors and invitees first). Posting on arXiv is allowed, but simultaneous submission to other conferences or journals is prohibited."
