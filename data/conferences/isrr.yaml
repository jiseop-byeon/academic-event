id: isrr
acronym: "ISRR"
name: "International Symposium of Robotics Research"
organizer: "International Foundation of Robotics Research (IFRR)"
fields: [robotics, manipulation, physical-ai, navigation]
community: robotics
tier: 2
frequency: biennial
paper_format: "Up to 16 pages including references, Springer proceedings LaTeX template; optional video"
review:
  blind: single
proceedings: "Springer Proceedings in Advanced Robotics (SPAR)"
orientation:
  contribution: -1
  summary: "IFRR가 주관하는 격년 소규모 단일 트랙 심포지엄(약 40편)으로, 새 연구 영역을 여는 선구적 연구나 기존 분야의 권위 있는 리뷰를 높이 산다. 건설 로봇은 '새로운 연구 영역 개척' 관점의 비전과 실험 결과를 함께 제시할 때 의미가 있으며, 박사 초년생의 초기 결과보다는 성숙한 연구 프로그램에 어울린다."
  summary_en: "A small biennial single-track symposium (about 40 papers) run by the IFRR, it highly values pioneering research that opens a new research area and authoritative reviews of established fields. Construction robotics is meaningful here when presented with both a vision from the perspective of 'pioneering a new research area' and experimental results, and it suits a mature research program rather than the early results of an early-stage PhD student."
  values: ["pioneering research", "visionary perspectives", "single-track", "small and selective"]
fit: 1
take: "ISRR은 연구가 무르익은 박사 후반에 비전 논문으로 노릴 무대 — 지금은 막 끝난 2026 말라카 회차(11/16–20) 프로그램을 동향 파악용으로 참고하는 정도면 충분."
take_en: "ISRR is a venue to aim for with a vision paper in the later PhD years, once the research has matured — for now it is enough to consult the program of the just-finished 2026 Malacca edition (November 16–20) to follow trends."
editions:
  - year: 2028
    status: estimated
    deadlines:
      - {kind: paper, date: 2028-06-30, estimated: true}
    notes: "격년 개최(2022 제네바, 2024 롱비치, 2026 말라카)로 2028 회차가 예상되나 2026-11-26 기준 공지된 개최지·일정이 없다(검색 결과 없음; IFRR 사이트는 인증서 만료로 이번에 열리지 않았다). 논문 마감은 2024 회차(7/31, 8/5로 연장; 12월 개최)와 2026 회차(5/31; 11월 개최)의 중간인 6월 말로 추정했다."
    notes_en: "Held biennially (2022 Geneva, 2024 Long Beach, 2026 Malacca), so a 2028 edition is expected, but as of 2026-11-26 no location or schedule has been announced (nothing found in search; the IFRR site could not be opened this time because its certificate has expired). The paper deadline is estimated at the end of June, between the 2024 edition (7/31, extended to 8/5; held in December) and the 2026 edition (5/31; held in November)."
