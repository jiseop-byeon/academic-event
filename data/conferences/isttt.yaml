    status: confirmed
    start: 2028-07-03
    end: 2028-07-06
    city: "Brisbane"
    country: AU
    venue: "GHD Auditorium, Advanced Engineering Building, University of Queensland St Lucia campus"
    lat: -27.47
    lon: 153.03
    url: "https://www.isttt2028.org/"
    deadlines:
      - {kind: abstract, date: 2027-01-15, label: "extended abstract (hard deadline)"}
      - {kind: notification, date: 2027-04-01, label: "decision on the extended abstract"}
      - {kind: paper, date: 2027-08-01, label: "full paper"}
      - {kind: other, date: 2027-11-01, label: "first-round reviews"}
      - {kind: other, date: 2028-01-15, label: "revised paper"}
      - {kind: notification, date: 2028-03-15, label: "final notification"}
    notes: "제27회 ISTTT. 7/2 사전 행사, 7/3–6 본행사이며 퀸즐랜드대·시드니대가 공동 주최한다. 확장 초록 마감(2027/1/15)은 연장 없는 마감으로 공지됐고, 초록 양식과 전체 논문 지침은 아직 나오지 않았다. 직전 ISTTT26(2026년 7월 뮌헨)은 마감을 두 차례 연장했었다."
    notes_en: "The 27th ISTTT: a pre-symposium day on July 2, then July 3-6, co-hosted by the University of Queensland and the University of Sydney. The extended-abstract deadline (2027-01-15) is announced as a hard deadline; abstract templates and full-paper guidelines are not out yet. The previous ISTTT26 (Munich, July 2026) extended its deadlines twice."
