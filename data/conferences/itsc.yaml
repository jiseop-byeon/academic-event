    notes: "30회 기념 대회로, 1997년 첫 ITSC가 열린 보스턴으로 돌아간다. 공식 사이트에 마감 시각과 저자 안내는 아직 없으며, 2026년(나폴리)에는 3/1 23:59 PT 마감, 이중 익명 심사, 6쪽(+유료 2쪽) 규정이었다. 학회 전날에 워크숍·튜토리얼이 열린다."
    notes_en: "The 30th edition returns to Boston, where the first ITSC was held in 1997. The official site does not yet give the deadline time or author instructions; in 2026 (Naples) the deadline was March 1, 23:59 PT, with double-blind review and 6 pages plus 2 paid pages. Workshops and tutorials run on a pre-conference day."
