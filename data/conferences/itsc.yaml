  blind: double
proceedings: "IEEE Xplore"
journal_track: "Accepted papers presented at the conference are eligible for the journal special issues arranged for it (ITSC 2026 rule)"
orientation:
  contribution: 0
  summary: "IEEE ITSS의 대표 연례 학회로, 교통 이론·데이터 기반 모델링·시뮬레이션부터 현장 실험과 실제 배치까지 지능형 교통 전반을 다룬다. 6쪽 IEEE 논문을 이중 익명으로 심사하며, 심사 지침상 새 접근법이나 탄탄한 실험 결과 모두 기여로 인정되고 SOTA보다 낮은 성능만으로는 떨어뜨리지 않는다. 자율주행·협력 주행, 인지·센싱, 교통안전 논문이 많고, 2026년에는 산업 기여를 위한 별도 트랙도 운영됐다."
  summary_en: "The flagship annual conference of the IEEE ITS Society, covering intelligent transportation from theory, data-driven modeling and simulation to field tests and real deployments. Six-page IEEE papers get double-blind review; the reviewer guidelines count either a new approach or strong experimental results as a contribution, and below-SOTA performance alone is not grounds for rejection. Automated and cooperative driving, sensing and perception, and traffic safety dominate, and 2026 ran a dedicated industry track."
  values: ["field tests", "connected and automated vehicles", "sensing and perception", "traffic safety"]
fit: 2
take: "노변 LiDAR 인지와 AR 경고를 묶은 교통안전 시스템을 6쪽 논문으로 내기 좋은 IEEE 학회이니, 2027년 3월 1일 마감인 ITSC 2027(보스턴)을 현장 실험 결과로 노려 보자."
take_en: "A good IEEE venue for a six-page paper on a traffic-safety system that pairs roadside-LiDAR perception with AR warnings — aim at ITSC 2027 in Boston (deadline 2027-03-01) with field results."
