id: itsc
acronym: "ITSC"
name: "IEEE International Conference on Intelligent Transportation Systems"
organizer: "IEEE Intelligent Transportation Systems Society (ITSS)"
fields: [transportation, navigation, vision, ml, hri]
community: transportation
tier: 2
rankings:
  h5_index: 50
  h5_year: 2025
frequency: annual
paper_format: "6 pages expected, up to 8 with 2 extra pages at a charge, IEEE double-column; the limit includes references and appendices (ITSC 2026 rule; the 2027 author page is still under construction)"
