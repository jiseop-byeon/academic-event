    notes: "제38회 IV로 서호주 퍼스에서 열린다. 논문 마감은 11/15 23:59 AWST(UTC+8)이고 첫 제출부터 이중 익명이며 영상도 익명화해야 한다. 워크숍 논문(2/1)과 산업 트랙(3/15)은 마감이 더 늦다. 다음 IV 2028은 2028년 6/27–30 바르셀로나 개최가 발표됐다."
    notes_en: "The 38th IV, held in Perth, Western Australia. Papers are due November 15, 23:59 AWST (UTC+8); review is double-blind from the first submission and videos must be anonymized too. Workshop papers (February 1) and the industry track (March 15) close later. IV 2028 has been announced for Barcelona, June 27-30, 2028."
