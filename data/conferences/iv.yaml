proceedings: "IEEE Xplore"
journal_track: "Presentation-only track for papers published in 2025-2027 in T-IV, T-ITS, T-RO, TPAMI and other IEEE journals (requests by December 1, 2026; not reviewed again, not in the proceedings)"
orientation:
  contribution: 0
  summary: "자율주행차와 차량-인프라 협력을 다루는 IEEE ITSS의 대표 심포지엄으로, 인지·센서 융합·측위·계획·제어부터 보행자 등 교통약자 보호와 HMI까지 지능형 차량 기술 전반을 6쪽 논문으로 받는다. 심사 지침상 새 접근법이나 강한 실험 결과 모두 기여로 인정되고, SOTA보다 낮은 성능만으로는 거절하지 않는다. 실차·실데이터 검증이 있는 논문이 강하며, 차량이 아닌 응용은 지능형 차량과의 연결고리를 분명히 해야 한다."
  summary_en: "The IEEE ITS Society's flagship symposium on automated vehicles and vehicle-infrastructure cooperation, taking six-page papers across perception, sensor fusion, localization, planning and control, vulnerable-road-user protection and HMI. Its reviewer guidelines count either a new approach or strong experimental results as a contribution, and below-SOTA performance alone is not grounds for rejection. Papers validated on real vehicles or real data do best; applications outside vehicles need a clear link to intelligent vehicles."
  values: ["real-vehicle validation", "perception and sensor fusion", "vulnerable road users", "concise six-page papers"]
fit: 2
take: "보행자 보호·스마트 인프라·다중 센서 융합 주제가 노변 LiDAR 연구와 맞닿아 있으니, 결과가 준비됐다면 11월 15일(AWST) 마감인 IV 2027(퍼스)에 내고, 아니면 3월 1일 마감인 ITSC 2027로 넘기자."
take_en: "Its pedestrian-protection, smart-infrastructure and sensor-fusion topics overlap the roadside-LiDAR work — submit to IV 2027 in Perth (deadline November 15, AWST) if results are ready, otherwise move to ITSC 2027 (March 1)."
