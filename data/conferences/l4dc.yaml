  summary: "머신러닝·제어·최적화의 접점(동역학 모델 학습, 시스템 식별, 안전 강화학습, 물리 시스템 RL)을 다루는 단일 트랙 학회로, 10쪽(참고문헌 무제한)·단일맹검으로 심사하고 PMLR로 출판한다(2026 기준). 안정성·샘플 복잡도 같은 이론적 보장과 제어 관점의 엄밀함이 높이 평가되며, 로봇 실험은 가산점이지만 시스템 데모만으로는 부족하다. 채택 논문은 모두 포스터로 발표하고 일부만 구두 발표한다."
  values: ["learning-based control", "theoretical guarantees", "dynamical systems", "single-track"]
