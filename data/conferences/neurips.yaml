      - {kind: paper, date: 2026-05-06, tz: "AoE"}
      - {kind: rebuttal, date: 2026-08-03, tz: "AoE", label: "Author-reviewer-AC discussion Jul 27 – Aug 3"}
      - {kind: notification, date: 2026-09-24, tz: "AoE"}
      - {kind: other, date: 2026-10-06, tz: "UTC", time: "17:00", label: "Presentation site assignments"}
    notes: "시드니 본회의(12/6–12)와 애틀랜타·파리 위성 행사(12/9–13)로 분산 개최. 메인 트랙과 Evaluations & Datasets 트랙의 마감·통보 일정은 같다. 채택 논문 저자는 9/30까지 개최지 선호를 제출했고 10/6에 발표 장소가 배정된다."
    notes_en: "Held across multiple sites: the main conference in Sydney (12/6–12) and satellite events in Atlanta and Paris (12/9–13). The main track and the Evaluations & Datasets track have the same deadline and notification schedule. Authors of accepted papers submitted their venue preference by 9/30, and presentation sites are assigned on 10/6."
  - year: 2027
    status: estimated
    deadlines:
      - {kind: abstract, date: 2027-05-07, estimated: true}
      - {kind: paper, date: 2027-05-11, estimated: true}
    notes: "공식 Future Meetings 페이지에 '유럽'으로만 공지(도시·일정 미정). 마감은 2025(초록 5/11, 본문 5/15)·2026(5/4, 5/6) 패턴으로 5월 초중순을 추정했다."
    notes_en: "The official Future Meetings page lists only 'Europe' (city and schedule undecided). The deadlines are estimated for early to mid-May from the 2025 (abstract 5/11, full paper 5/15) and 2026 (5/4, 5/6) pattern."
