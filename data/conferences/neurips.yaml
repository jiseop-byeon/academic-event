id: neurips
acronym: "NeurIPS"
name: "Conference on Neural Information Processing Systems"
organizer: "NeurIPS Foundation"
fields: [ml, physical-ai, xai]
community: ml
tier: 1
rankings:
  core: "A*"
  h5_index: 371
  h5_year: 2025
frequency: annual
paper_format: "9 content pages (+1 at camera-ready); references, appendix and checklist not counted"
review:
  blind: double
  rebuttal: true
  acceptance_rate: {value: 0.245, year: 2025, note: "5,290 of 21,575 valid main-track submissions"}
proceedings: "Advances in Neural Information Processing Systems (NeurIPS Proceedings)"
journal_track: "TMLR papers with a J2C Certification can be presented in the NeurIPS/ICML/ICLR Journal-to-Conference track"
orientation:
  contribution: -2
  summary: "ML 최상위 학회로 메인 트랙은 새로운 알고리즘·이론적 통찰과 엄밀한 실험을 요구하며(본문 9쪽, OpenReview 이중맹검과 저자-리뷰어 토론), 시스템 통합만으로는 거의 채택되지 않는다. 2026년부터 Datasets & Benchmarks를 이은 'Evaluations & Datasets' 트랙이 새 모델 없이도 데이터셋·평가 프로토콜·벤치마크 기여를 받아주므로(익명화가 불가능한 데이터셋은 단일맹검 요청 가능), 건설 조작·인식 데이터셋이나 벤치마크는 이 트랙이 현실적인 경로다."
  summary_en: "The top ML conference: the main track demands new algorithms or theoretical insight and rigorous experiments (9-page main text, double-blind review on OpenReview with author-reviewer discussion), and systems integration alone is hardly ever accepted. From 2026, the 'Evaluations & Datasets' track, which succeeds Datasets & Benchmarks, accepts dataset, evaluation-protocol and benchmark contributions even without a new model (single-blind review can be requested for datasets that cannot be anonymized), so for a construction manipulation or perception dataset or benchmark, this track is the realistic path."
  values: ["algorithmic novelty", "theoretical insight", "rigorous experiments", "evaluations & datasets track"]
fit: 2
take: "메인 트랙은 ML 방법론 기여가 없으면 어렵지만, 건설 조작 데이터셋·벤치마크를 만든다면 NeurIPS 2027 Evaluations & Datasets 트랙(5월 중순 마감 추정)을 진지하게 노려라."
take_en: "The main track is hard without an ML methodology contribution, but if you build a construction manipulation dataset or benchmark, seriously aim for the NeurIPS 2027 Evaluations & Datasets track (deadline estimated in mid-May)."
editions:
  - year: 2026
    status: confirmed
    start: 2026-12-06
    end: 2026-12-12
    city: "Sydney"
    country: AU
    lat: -33.87
    lon: 151.21
