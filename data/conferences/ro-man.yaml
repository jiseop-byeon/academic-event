  summary: "인간-로봇 상호작용 전반(소셜 로봇, 협업, 원격조작, 보조 로봇)을 폭넓게 받는 IEEE 계열 학회로, HRI보다 문턱이 낮아 시스템 구현과 소규모 사용자 평가를 갖춘 논문도 채택된다. 건설 작업자-로봇 협업, 작업자 의도 인식, 원격조작 인터페이스 같은 주제가 자연스럽게 맞는다."
