    notes: "RSS 2027 심사 제도 변경: (1) 기존 단일 마감+rebuttal을 2단계 셰퍼딩으로 대체 — 12/4 6쪽 확장 초록(문제·방법 완성, 실험은 예비 가능) → 2/5 탈락 또는 Stage 2 초대(메타리뷰에 필요한 보완·평가·방법 확장 명시) → 2/12 rebuttal → 2/26 확정 'Extension Charter' 수령 → 4/16 Charter를 이행한 8쪽 최종 논문 제출 → PC가 이행 여부와 과학적 통찰을 확인해 4/30 최종 채택 통보. (2) Charter를 이행했다면 부정적 실험 결과만으로는 탈락하지 않음. (3) 채택 논문은 리뷰어·체어 이름 공개. 취지는 장기적 과학 진보·재현 가능한 방법론으로 무게중심을 옮기고 급증하는 투고량을 관리하는 것. 동시 투고 금지(arXiv 공개는 허용)라 같은 원고로 IROS 2027(3/1 마감)과 병행할 수 없다. 장소 세부는 미정."
    notes_en: "RSS 2027 review system change: (1) The former single deadline plus rebuttal is replaced by 2-stage shepherding — 12/4 6-page extended abstract (problem and method complete, experiments may be preliminary) → 2/5 rejection or invitation to Stage 2 (the metareview specifies the additions, evaluations and method extensions required) → 2/12 rebuttal → 2/26 receipt of the finalized 'Extension Charter' → 4/16 submission of an 8-page final paper that carries out the Charter → the PC checks fulfillment and scientific insight and sends the final acceptance notification on 4/30. (2) If the Charter has been carried out, negative experimental results alone do not cause rejection. (3) Names of reviewers and chairs are disclosed for accepted papers. The aim is to shift the center of gravity toward long-term scientific progress and reproducible methodology and to manage the surging submission volume. Because simultaneous submission is prohibited (posting on arXiv is allowed), the same manuscript cannot be submitted in parallel to IROS 2027 (3/1 deadline). Venue details are not yet decided."
