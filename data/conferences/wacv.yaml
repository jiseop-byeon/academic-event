id: wacv
acronym: "WACV"
name: "IEEE/CVF Winter Conference on Applications of Computer Vision"
organizer: "IEEE Computer Society & Computer Vision Foundation (CVF)"
fields: [vision, ml]
community: vision
tier: 2
rankings:
  core: "A"
  h5_index: 131
  h5_year: 2025
frequency: annual
paper_format: "8 pages excluding references (WACV template); revised Round-1 papers add a 1-page rebuttal"
review:
  blind: double
  rebuttal: true
proceedings: "CVF Open Access and IEEE Xplore"
orientation:
  contribution: 0
  summary: "응용(Applications)·알고리즘(Algorithms)·평가/데이터셋(Evaluations & Datasets) 세 트랙을 두고, 응용 트랙은 시스템 수준의 혁신·도메인 신규성·비교 평가로 심사해 건설 현장 인식 같은 도메인 특화 비전 시스템에 가장 우호적인 CVF 학회다. 1라운드에서 accept / revise-and-resubmit / reject를 받고 수정본과 1쪽 rebuttal로 재심사받는 저널형 2라운드 구조이며, 2026년 1라운드 즉시 채택은 1,329편 중 85편(6.4%)이었고 732편이 재투고를 요청받았다."
  values: ["applications track", "systems-level innovation", "domain novelty", "two-round review"]
fit: 2
take: "건설 현장 인식·로봇 비전 시스템 논문에 가장 현실적인 비전 학회이므로, WACV 2028 1라운드(2027년 6월 말 전후 예상)를 첫 인식 논문의 1차 타깃으로 잡아라."
