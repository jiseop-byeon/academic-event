      - {kind: other, date: 2027-05-07, label: "work-in-progress papers; hands-on demonstrations and Haptic Design Showcase"}
      - {kind: other, date: 2027-05-14, label: "previously published papers (PPP)"}
      - {kind: camera-ready, date: 2027-05-14}
    notes: "2026-11-26 확인: 공식 사이트가 일정을 갱신해 장편·정규 논문은 1/29 초록, 2/5 본문 제출로 나뉘었고(이전 공지는 1/29 본문 마감), 통보는 4/20, WIP·데모는 5/7, 기발표 논문(PPP)과 최종본은 5/14다. 이전의 '잠정' 표기와 7/12–15 표기는 사라지고 7/13–16으로 통일됐으며, 마감 시간대는 표기되지 않았다. 격년(홀수 해) 개최로 짝수 해에는 IEEE Haptics Symposium이 열린다."
    notes_en: "Checked 2026-11-26: the official site has updated its schedule, so long and regular papers now have an abstract deadline of 1/29 and a full-paper deadline of 2/5 (previously the paper deadline was 1/29), notification on 4/20, work-in-progress papers and demos on 5/7, and previously published papers (PPP) and camera-ready on 5/14. The 'tentative' label and the 7/12–15 range are gone; the site now consistently gives 7/13–16, and no deadline time zone is stated. It is held biennially (in odd years), and in even years the IEEE Haptics Symposium takes place."
