      - {kind: abstract, date: 2027-01-29, label: "long and regular papers"}
      - {kind: paper, date: 2027-02-05, label: "long and regular papers"}
      - {kind: other, date: 2027-03-26, label: "Student Innovation Challenge proposals"}
      - {kind: workshop-proposal, date: 2027-04-02, label: "workshop/tutorial full proposal"}
