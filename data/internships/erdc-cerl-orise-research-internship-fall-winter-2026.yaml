eligibility_note: "공고에 시민권 요건 문구가 없음(같은 시기 ERDC EL·CHL 공고는 대부분 미국 시민 전용). 마감일 없이 충원 시까지, 즉시 임용 가능. 지원금은 학위 단계·전공·경력에 따라 CERL이 결정. 공고상 근무지는 'Location Varies'이며 CERL 본소는 일리노이주 Champaign."
eligibility_note_en: "The posting has no citizenship language (most ERDC EL and CHL postings from the same period are US-citizen only). No deadline — open until filled, with immediate appointments possible. CERL sets the stipend by degree level, discipline and experience. Location is listed as 'Location Varies'; CERL headquarters is in Champaign, Illinois."
