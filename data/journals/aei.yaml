orientation:
  contribution: 0
  summary: "건설·제조 등 공학 전반의 정보학(AI, 지식 표현, 디지털 트윈, 인간-기계 협업)을 다루는 상위 저널로, 건설 분야 논문 비중이 크다. AutCon보다 방법론·정보학적 기여를 더 중시해 새 모델이나 프레임워크와 탄탄한 실험을 함께 요구한다. 로봇 학습·HRC 등 로봇 논문도 꾸준히 실린다."
  summary_en: "A top journal on engineering informatics (AI, knowledge representation, digital twins, human-machine collaboration) across construction, manufacturing and other fields, with a large share of construction papers. It puts more weight than AutCon on methodological and informatics contributions, expecting a new model or framework backed by solid experiments. Robotics papers, such as robot learning and HRC, appear regularly."
  values: ["informatics novelty", "rigorous experiments", "AI & digital twins", "construction-heavy"]
fit: 3
take: "조작 정책 학습이나 인지 모듈처럼 방법론 기여가 뚜렷한 결과는 AutCon과 함께 AEI를 1순위 후보로 두자."
take_en: "For results with a clear methodological contribution, such as manipulation policy learning or perception modules, keep AEI alongside AutCon as a first-choice target."
