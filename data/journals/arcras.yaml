  summary: "제어·로보틱스·자율 시스템 분야의 이론·응용 발전을 종합하는 연간 리뷰 저널로, 역학·최적화·머신러닝·신경과학 등과의 접점까지 다룬다. 원저 연구가 아니라 분야를 정리하는 권위 있는 종설만 실으며, JCR 2026(2025년 데이터)에서 로보틱스 48종 중 3위, 자동화·제어 88종 중 2위다. Subscribe to Open 방식으로 2023–2025년 권호가 모두 무료 공개됐다."
  summary_en: "An annual review journal that synthesizes theoretical and applied advances in control, robotics and autonomous systems, including their interfaces with dynamics, optimization, machine learning and neuroscience. It publishes only authoritative reviews that take stock of a field, not original research, and ranks 3rd of 48 in Robotics and 2nd of 88 in Automation & Control Systems in JCR 2026 (2025 data). Under Subscribe to Open, all 2023–2025 volumes are free to read."
  values: ["comprehensive reviews", "authoritative synthesis", "control and robotics", "open access via S2O"]
