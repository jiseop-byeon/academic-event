take: "투고 대상이라기보다 접촉 조작·로봇 학습 분야의 흐름을 빠르게 파악하는 필독 리뷰 저널로 활용하자."
take_en: "Treat it less as a submission target than as a must-read review journal for quickly catching up on contact-rich manipulation and robot learning."
