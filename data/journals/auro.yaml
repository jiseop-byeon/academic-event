  summary: "자율 로봇의 이론과 응용을 다루는 Springer의 전통 있는 로보틱스 저널로, 계획·학습·인식·제어처럼 로봇의 자율성을 높이는 방법을 실험으로 검증한 논문이 중심이다. 2025년 게재 논문이 50편 안팎(OpenAlex 기준)으로 규모가 작다. 건설 응용은 자율성 측면의 방법론적 기여를 분명히 해야 한다."
  summary_en: "A long-established Springer robotics journal on the theory and applications of autonomous robots, centred on experimentally validated methods that make robots more autonomous, such as planning, learning, perception and control. It is small, with about 50 papers published in 2025 (per OpenAlex). Construction applications need a clear methodological contribution to autonomy."
