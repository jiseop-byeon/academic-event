conference_link: "EC3 2027 우수 논문은 Automation in Construction 확장 투고로 초청된다."
conference_link_en: "Selected EC3 2027 papers are invited to submit extended versions to Automation in Construction."
orientation:
  contribution: 1
  summary: "건설 자동화·로보틱스·IT 분야 최상위 저널로, 실제 현장 데이터나 실험으로 검증된 시스템·방법론 논문이 주류다. 범용 알고리즘 신규성보다 건설 문제에 맞춘 새 접근과 정량 검증을 요구하며, 로봇 하드웨어·현장 실험 논문은 특히 환영받는다. 기존 딥러닝 모델을 단순 적용한 사례 연구는 데스크 리젝되기 쉽다."
  summary_en: "The top journal for construction automation, robotics and IT, dominated by system and method papers validated with real site data or experiments. It asks for new approaches tailored to construction problems and quantitative validation rather than general algorithmic novelty, and robot hardware and field-experiment papers are especially welcome. Case studies that simply apply existing deep learning models tend to be desk-rejected."
  values: ["construction-specific novelty", "field validation", "robotics welcome", "high selectivity"]
fit: 3
take: "건설 로봇 조작 연구의 최종 목표 저널이니, 현장급 실험과 베이스라인 정량 비교를 갖춘 첫 저널 논문을 이곳에 겨냥하자."
take_en: "The ultimate target for construction robot manipulation research: aim your first journal paper here, with field-grade experiments and quantitative comparisons against baselines."
