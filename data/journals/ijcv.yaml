orientation:
  contribution: -1
  summary: "컴퓨터비전 전문 최상위 저널로 방법론의 깊이와 포괄적인 실험을 중시하며, CVPR·ICCV·ECCV 논문의 충실한 확장판과 특별호 초청 논문이 많이 실린다. 건설 현장 인식 연구도 비전 방법론으로서의 기여와 폭넓은 비교 실험을 갖추면 경쟁할 수 있다."
  summary_en: "A top computer vision journal that values methodological depth and comprehensive experiments; many papers are thorough extensions of CVPR, ICCV and ECCV work or invited special-issue papers. Construction-site perception work can compete if it contributes as a vision method and includes broad comparative experiments."
  values: ["methodological depth", "comprehensive experiments", "extended conference work"]
fit: 1
take: "첫 결정 중앙값 37일로 빠르고 학회 논문 확장판을 환영해, 학회에서 발표한 건설 인식 연구를 저널로 확장할 때 1순위로 고려할 비전 저널이다."
take_en: "With a fast 37-day median to first decision and a welcome for extended conference papers, it is the first vision journal to consider when turning presented construction perception work into a journal paper."
