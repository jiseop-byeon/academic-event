conference_link: "ISPRS 학술대회 발표를 바탕으로 한 논문도 의미 있는 기여로 인정되면 게재한다."
conference_link_en: "Papers based on ISPRS meeting presentations are published when they are judged significant contributions."
orientation:
  contribution: 0
  summary: "ISPRS의 공식 저널로 사진측량, 원격탐사, 공간정보, 컴퓨터 비전 분야 최상위 저널이다. 항공·지상·모바일 레이저 스캐닝, 센서 보정·정합, 점군 처리, 3차원 재구성·매핑, 디지털 트윈, 근거리 계측까지 센서·이론·시스템·응용을 폭넓게 다룬다. 이론 논문은 응용을, 시스템·응용 논문은 이론적 배경을 갖추길 권하며, 새 분야의 혁신적 응용과 학제적 연구를 특히 반긴다."
  summary_en: "The official ISPRS journal and a top venue for photogrammetry, remote sensing, spatial information and computer vision. It spans sensors, theory, systems and applications: airborne, terrestrial and mobile laser scanning, sensor calibration and orientation, point-cloud processing, 3D reconstruction and mapping, digital twins and close-range metrology. Theory papers are expected to include applications and system or application papers a theoretical background, and innovative applications in new fields and interdisciplinary work are especially welcome."
  values: ["LiDAR and point clouds", "theory with applications", "3D reconstruction and mapping", "interdisciplinary"]
fit: 2
take: "건설 현장 LiDAR 점군 처리, 센서 정합, SLAM 기반 매핑·디지털 트윈 연구가 이론적 배경과 함께 나오면 노릴 상위 저널이며, 로봇 조작 자체보다는 인지·매핑 결과를 내기에 맞다."
take_en: "A top journal for construction-site LiDAR point-cloud processing, sensor registration and SLAM-based mapping or digital twins backed by theory; better suited to perception and mapping results than to robot manipulation itself."
