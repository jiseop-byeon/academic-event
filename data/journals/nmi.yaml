  summary: "Nature 계열의 ML·AI·로보틱스 저널로 학제적 파급력과 넓은 독자층에 대한 의의를 가장 중시하며, 전문 에디터가 데스크 단계에서 대부분을 거른다. 실제 환경에서 검증된 로봇 학습이나 과학·공학 문제를 바꾸는 AI 응용이 실릴 수 있지만, 본문 3,500단어·그림 6개 안에 강한 서사로 압축해야 한다."
  summary_en: "A Nature Portfolio journal for ML, AI and robotics that prizes interdisciplinary impact and significance to a broad readership above all; professional editors filter out most submissions at the desk. Robot learning validated in real environments, or AI applications that change scientific and engineering problems, can get in, but must be compressed into a strong narrative of 3,500 words and six display items."
  values: ["broad significance", "interdisciplinary impact", "real-world validation"]
