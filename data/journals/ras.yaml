take: "RA-L·T-ASE에서 거절된 건설 조작·내비게이션 연구를 장편으로 보완해 낼 수 있는 무난한 백업 저널이지만, 영향력과 학회 연계는 그보다 약하다."
take_en: "A solid backup journal for construction manipulation or navigation work rejected by RA-L or T-ASE, reworked into a longer paper, though its impact and conference links are weaker than theirs."
