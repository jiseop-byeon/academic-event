  summary: "Elsevier의 범용 로보틱스 저널로 인식·계획·제어·학습·HRI 등 넓은 주제를 다루며, 새 방법과 실험 검증을 갖춘 응용 지향 논문도 폭넓게 받는다. 2025년 게재 논문이 300편을 넘을 만큼(OpenAlex 기준) 규모가 커서 RA-L보다 문턱이 낮은 편으로 여겨진다."
  summary_en: "Elsevier's general robotics journal covering a broad range of topics, including perception, planning, control, learning and HRI, and it readily accepts application-oriented papers with a new method and experimental validation. It is large, with more than 300 papers published in 2025 (per OpenAlex), and is generally seen as having a lower bar than RA-L."
