length: "Suggested: regular 10 pages, short 6, practitioner 6, survey 18; up to 6 extra pages at $175 each"
article_types: ["regular", "short", "practitioner", "survey"]
conference_link: "IV 2027의 저널 발표 트랙에서 2025–2027년 게재된 T-ITS 논문을 발표할 수 있다(재심사 없음, 2026년 12월 1일까지 신청)."
conference_link_en: "T-ITS papers published in 2025-2027 can be presented through the IV 2027 journal-presentation track (no new review; requests by December 1, 2026)."
orientation:
  contribution: 0
  summary: "현대 교통 시스템의 센싱·통신·제어·계획·구현을 아우르는 IEEE 지능형 교통 분야 대표 저널로, Google Scholar 교통 분야 h5 지수 1위다. 모델링·시뮬레이션부터 AI·데이터 분석까지 방법은 열려 있지만 교통 시스템에 대한 분명한 적용을 보여야 하며, 실무자 논문(practitioner paper) 유형도 있어 현장 배치 연구도 받는다. 일반 비전·ML 논문을 교통 데이터에 적용만 한 원고는 적용 기여가 약하면 거절되기 쉽다."
  summary_en: "IEEE's flagship journal for intelligent transportation, spanning sensing, communications, control, planning and deployment, and ranked first by Google Scholar h5-index in transportation. Methods are open, from modeling and simulation to AI and data analytics, but papers must show a clear application to transportation systems; a practitioner-paper type also welcomes deployment work. Generic vision or ML papers merely run on traffic data tend to be rejected if the application contribution is thin."
  values: ["clear transportation application", "sensing and perception", "deployment-friendly", "high visibility"]
fit: 2
take: "노변 LiDAR 인지와 AR 경고 시스템을 실제 교차로 데이터로 검증한 결과를 저널로 낼 때 가장 현실적인 교통 분야 상위 저널이며, 채택 후 IV 저널 트랙으로 발표까지 이어갈 수 있다."
take_en: "The most realistic top transportation journal for roadside-LiDAR perception and AR warnings validated on real intersection data, and an accepted paper can then be presented through the IV journal track."
