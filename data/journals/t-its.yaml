  speed_note: "최소 2명의 심사위원이 단일 익명으로 심사하며, 2022년부터 심사는 최대 3라운드(수정 기회 2번)로 제한되고 2차 수정 이후에는 대폭 수정(major revision)을 요구하지 않는다. 첫 결정까지 기간과 채택률은 공개돼 있지 않다."
  speed_note_en: "At least two reviewers under single-anonymous review; since 2022 a submission gets at most three review rounds (two revisions), with no major revisions after the second round. Time to first decision and acceptance rate are not published."
