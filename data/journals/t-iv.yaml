orientation:
  contribution: 0
  summary: "자율주행을 중심으로 도로 환경의 지능형 차량을 다루는 IEEE ITSS 저널로, 혁신적 연구 개념과 응용 결과, 중요한 이론적 발견과 응용 사례 연구를 함께 싣는다. 인지·측위·계획·제어와 사람-차량 상호작용 논문이 많고, 실무자 논문 유형도 있다. 다만 Web of Science에서 'On Hold' 상태(LetPub 기준)라 2026년 JCR 영향력 지수가 없어, 평가 기준에 따라 실적 가치가 낮게 매겨질 수 있다."
  summary_en: "The IEEE ITS Society's journal on intelligent vehicles in road environments, especially automated driving, publishing innovative research concepts and application results alongside significant theoretical findings and application case studies. Perception, localization, planning, control and human-vehicle interaction dominate, and there is a practitioner-paper type. However, it is 'On Hold' in Web of Science (per LetPub) and has no 2026 JCR impact factor, so some evaluators may discount it."
  values: ["automated vehicles", "perception and planning", "application case studies", "WoS on hold"]
fit: 2
take: "보행자 보호·노변 인지 연구와 주제는 잘 맞지만 Web of Science 'On Hold' 상태가 풀릴 때까지는 T-ITS를 우선 고려하고, 투고 전에 등재 상태를 다시 확인하자."
take_en: "Topically a good match for pedestrian-protection and roadside-perception work, but prefer T-ITS until its Web of Science 'On Hold' status is lifted, and recheck the indexing status before submitting."
