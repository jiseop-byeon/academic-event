  speed_note: "단일 익명 심사로, 게재 논문마다 독립 심사자 2인 이상이 본다. 약 10주 안에 심사 결과를 주는 것을 목표로 하며, 투고 때 심사자 6명을 추천해야 한다. 채택률은 공개돼 있지 않다. 편집장은 Simon Fraser University의 Ljiljana Trajkovic 교수다."
  speed_note_en: "Single-anonymous review with at least two independent reviewers per published article. The journal aims to return review results in about ten weeks, and authors must suggest six reviewers at submission. The acceptance rate is not published. The editor-in-chief is Prof. Ljiljana Trajkovic of Simon Fraser University."
