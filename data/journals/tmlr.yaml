  summary: "'주장이 정확하고 설득력 있는 근거로 뒷받침되는가'와 '독자 일부라도 관심을 가질 결과인가'만 심사하고 주관적 중요도(novelty·impact)는 따지지 않는 ML 저널로, OpenReview에서 이중맹검 공개 심사를 하며 상시 투고를 받는다. 로봇 학습의 실증 분석·재현 연구·부정적 결과도 실릴 수 있지만 ML 관점의 명확한 주장이 있어야 하며, 2025년 1월부터 Scopus·DOAJ에 색인됐지만 Web of Science는 2025년 말 기준 심사 중이라 JIF가 없다."
