  speed_note: "2025 연례보고서 기준 투고→결정 중앙값은 단편(12쪽 이하) 91일, 장편 104일. 채택률 70.6%는 철회·데스크리젝트를 제외한 수치이며 포함하면 46.3%다. 월 약 250편이 투고되며, 2024·2025년에는 12월 초~1월 초 연휴 기간에 신규 투고를 중단했다."
