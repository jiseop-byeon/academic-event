take: "인식 연구를 학회 논문 여러 편으로 쌓은 뒤 확장판을 낼 때 고려할 곳이며, 박사 초반의 1차 타깃은 아니다."
take_en: "Consider it for an extended version once your perception research has built up across several conference papers; not a first target early in the PhD."
