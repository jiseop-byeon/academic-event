  summary: "패턴인식·컴퓨터비전·머신러닝 분야의 최고 권위 저널로, 학회 수준을 넘는 방법론적 깊이와 광범위한 실험을 갖춘 논문, 학회 논문을 크게 확장한 저널판, 영향력 있는 서베이가 주로 실린다. 건설 응용 논문은 방법론의 일반성을 보여야 하며, 응용 시스템 중심 논문은 적합하지 않다."
  summary_en: "The most prestigious journal in pattern recognition, computer vision and machine learning, mainly publishing papers with methodological depth and extensive experiments beyond conference level, substantially extended journal versions of conference papers, and influential surveys. Construction application papers must show methodological generality; papers centred on application systems are a poor fit."
  values: ["methodological depth", "extensive experiments", "extended conference work", "surveys"]
