orientation:
  contribution: -1
  summary: "신기술이 교통 시스템의 계획·설계·운영·제어·유지관리에 미치는 영향을 다루는 교통 분야 최상위 저널로, 저널 스스로 '지적 중심은 기술이 아니라 교통 쪽'이라고 밝힌다. 운영과학·제어·복잡계 네트워크·컴퓨터과학·AI의 정량 방법을 결합해 모니터링·효율·안전·신뢰성 개선을 실데이터나 시뮬레이션으로 엄밀하게 보인 논문이 주류이며, 자율주행·ITS·보행자 등 저속 교통수단도 범위에 들고 대규모 데이터셋 공개를 특히 장려한다. 교통 문제와의 연결이 약한 일반 ML·인지 논문이나 단순 적용 사례는 경쟁력이 낮다."
  summary_en: "A top transportation journal on how emerging technologies affect the planning, design, operation, control and maintenance of transportation systems; it states that its intellectual core is on the transportation side, not the technology side. Most papers combine quantitative methods from operations research, control, complex networks, computer science and AI and rigorously show gains in monitoring, efficiency, safety or reliability with real data or simulation; automated vehicles, ITS, and pedestrians and soft modes are in scope, and releasing large-scale datasets is especially encouraged. Generic ML or perception papers with a weak link to a transportation problem, or plain application case studies, struggle."
  values: ["transportation-side contribution", "methodological rigor", "real-data validation", "open datasets"]
fit: 2
take: "노변 LiDAR 인지와 보행자-차량 충돌 위험 판단을 새 방법론으로 정식화하고 실데이터로 검증하면 노릴 교통 분야 최상위 저널이며, 단순 시스템 구축 보고라면 T-ITS나 학회가 더 맞다."
take_en: "The top transportation journal to aim at once roadside-LiDAR perception and pedestrian-vehicle conflict assessment are cast as a new method and validated on real data; a plain system-build report fits T-ITS or a conference better."
