take: "운영과학 기반 교통 이론 저널이라 건설 로봇·교통안전 시스템 연구와는 거리가 멀어 참고용이며, 투고 대상으로 삼을 필요는 없다."
take_en: "An operations-research transportation journal, far from construction robotics or traffic-safety systems; keep it for reference rather than as a target."
