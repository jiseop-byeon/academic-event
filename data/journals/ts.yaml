  summary: "INFORMS 교통과학·물류 학회(TSL)의 대표 저널로, 운영과학(OR) 관점에서 모든 교통 수단의 계획·설계·운영 문제를 다루는 교통 분석 분야 최고 권위지다. 네트워크 균형, 차량 경로·스케줄링, 물류, 교통류 모형처럼 새 최적화 모형·알고리즘과 그 이론적 성질을 엄밀하게 보이는 논문이 중심이다. 실험·시스템 중심 연구는 방법론적 기여가 없으면 맞지 않는다."
  summary_en: "The flagship journal of the INFORMS Transportation Science and Logistics (TSL) Society and the leading journal of transportation analysis from an operations-research angle, covering planning, design and operations across all modes. Papers center on new optimization models and algorithms (network equilibrium, vehicle routing and scheduling, logistics, traffic flow models) with rigorous theoretical properties. Experimental or system-driven work does not fit without a methodological contribution."
  values: ["operations research", "optimization models and algorithms", "theoretical rigor", "INFORMS TSL flagship"]
