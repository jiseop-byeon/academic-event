conference_link: "IEEE VR·ISMAR·IEEE VIS·PacificVis의 저널 트랙 채택 논문이 TVCG 특집호로 출판된다. VR과 ISMAR는 한 번의 통합 심사로 TVCG 논문과 학회 논문을 가른다."
conference_link_en: "Journal-track papers accepted at IEEE VR, ISMAR, IEEE VIS and PacificVis are published in TVCG special issues; VR and ISMAR decide between TVCG and conference papers in one unified review."
orientation:
  contribution: -1
  summary: "컴퓨터 그래픽스·시각화·가상현실 분야의 대표 월간 저널로, 렌더링, 기하 처리, 애니메이션, 인지·상호작용·사용자 인터페이스, 햅틱스, VR·AR·MR, 첨단 디스플레이 등을 다룬다. 중요한 연구 결과와 새 기법을 엄밀한 평가(사용자 연구 포함)와 함께 요구하며, AR·VR 연구자는 대개 IEEE VR이나 ISMAR의 저널 트랙을 거쳐 TVCG에 게재한다."
  summary_en: "The leading monthly journal for computer graphics, visualization and virtual reality, covering rendering, geometry processing, animation, perception, interaction and user interfaces, haptics, VR/AR/MR and advanced displays. It expects important results and new techniques backed by rigorous evaluation, including user studies, and AR/VR researchers usually reach it through the journal tracks of IEEE VR or ISMAR."
  values: ["new techniques", "rigorous evaluation", "VR/ISMAR journal track", "graphics and visualization"]
fit: 2
take: "AR 연구를 저널로 남기려면 TVCG에 직접 내기보다 ISMAR(3월)이나 IEEE VR(9월)의 저널 트랙에 투고해 TVCG 특집호를 노리는 편이 일반적이고 효율적이다."
take_en: "To publish AR work in a journal, the usual and efficient route is the journal track of ISMAR (March) or IEEE VR (September), aiming at a TVCG special issue, rather than a direct submission."
