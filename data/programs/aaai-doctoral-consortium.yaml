    - {kind: other, date: 2026-11-23, label: "재정 지원 통보", label_en: "Funding notification"}
    - {kind: other, date: 2026-12-05, label: "학위 연구 요약 카메라레디 마감", label_en: "Camera-ready thesis summary due"}
    - {kind: event, date: 2027-02-16, label: "AAAI-27 Doctoral Consortium (2/16–17, 몬트리올)", label_en: "AAAI-27 Doctoral Consortium (Feb 16–17, Montréal)"}
