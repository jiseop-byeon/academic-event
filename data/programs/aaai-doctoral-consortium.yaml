fit: 1
take: "AI 전반의 박사 연구 피드백 자리라 건설 로봇 연구의 주 무대가 아니고 '연구 진척'이 심사 기준이므로, 10/13 마감은 참고만 하고 학위 연구가 구체화된 뒤 XAI·인간 의도 예측 결과가 쌓이면 지원을 검토하라."
take_en: "A general-AI venue for thesis feedback rather than a main stage for construction robotics, and research progress is a review criterion — treat the Oct 13 deadline as reference only and consider applying once the thesis is well defined and XAI or human-intent results have accumulated."
