fit: 2
take: "건설 작업자용 AR 인터페이스나 작업자-로봇 상호작용 연구를 단독 저자로 정리할 수 있다면, 1/21 마감 SRC가 CHI 본논문보다 문턱이 낮은 데뷔 경로이니 Gary Marsden 여행 지원(별도 마감)과 함께 노려라."
take_en: "If AR interfaces for construction workers or worker–robot interaction work can be written up single-author, the SRC (deadline Jan 21) is a lower-barrier debut at CHI than a full paper — pair it with a Gary Marsden travel award (separate deadline)."
