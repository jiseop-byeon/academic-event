fit: 2
take: "ICRA 2027이 서울에서 열려 이동 부담이 적으니, 10/31 채택 목록이 나오면 RGMC처럼 조작·인간-로봇 전달 과제가 있는 대회를 골라 연구실 로봇으로 팀 참가를 검토하라."
take_en: "ICRA 2027 is in Seoul, which makes travel easy — when the accepted list comes out on Oct 31, pick a competition with manipulation or human–robot handover tasks (like RGMC) and consider entering as a lab team."
