take: "2026년처럼 체화·물리 지능 쪽 주제가 이어진다면 건설 현장 인식·조작 연구에 바로 쓸 만한 최고 수준의 비전 여름학교이니, 2027년 4/1 마감(예상)에 추천서와 함께 지원하라."
take_en: "If the embodied and physical-intelligence focus of 2026 continues, this is a top-tier vision school directly useful for construction-site perception and manipulation — apply by the expected April 1, 2027 deadline with a reference letter."
