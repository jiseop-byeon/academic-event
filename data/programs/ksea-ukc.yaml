fit: 3
take: "KSEA 회원(대학원생 연 $15)으로 가입해 KSEA-KUSCO 장학금과 함께 준비하고, 2027년 UKC 초록 접수 때 'Infrastructure, Mobility & Robots' 클러스터에 건설 로봇 초록을 내거나 SEED·FIRE에 지원해 교통·숙박 지원을 받으며 한인 과학기술자 네트워크를 넓혀라."
take_en: "Join KSEA (graduate dues $15/year) and prepare alongside the KSEA-KUSCO scholarship; when UKC 2027 abstracts open, submit a construction-robotics abstract to UKC's 'Infrastructure, Mobility & Robots' cluster or apply to SEED or FIRE to get travel and lodging support while growing your network of Korean-American scientists and engineers."
