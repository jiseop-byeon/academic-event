id: mlss
name: "Machine Learning Summer School (MLSS) — Okinawa 2027"
organizer: "MLSS series; MLSS 2027 hosted by OIST (organizers Makoto Yamada, Kenji Fukumizu, Masashi Sugiyama, Amedeo Roberto Esposito)"
scope: international
kind: summer-school
audience: [phd, ms]
fields: [ml]
summary: "2002년 시작된 머신러닝 여름학교 시리즈로, 해마다 여러 도시에서 기초부터 최신 연구까지 핵심 ML 주제를 그 분야 대표 연구자들이 1–2주간 강의한다. 다음 회차는 2027년 3월 1–12일 일본 오키나와 온나촌의 OIST 컨퍼런스 센터에서 약 200명 규모로 열리며, ML 기술 배경이 탄탄한 석·박사생이 주 대상이다. 2026년에는 멜버른(2월), 뉴욕(6월), 튀빙겐(8–9월)에서 열렸다."
summary_en: "A machine-learning summer school series started in 2002, held in different cities each year, where leading researchers teach core ML topics from fundamentals to the state of the art over one to two weeks. The next edition runs March 1–12, 2027, at the OIST Conference Center in Onna, Okinawa, Japan, for about 200 participants, mainly master's and PhD students with strong technical ML backgrounds. In 2026 it was held in Melbourne (February), New York (June) and Tübingen (August–September)."
activities:
  - "12일간 ML 핵심 주제 강의 (기초부터 최신 연구까지)"
  - "전 세계 대학원생 약 200명과의 교류"
activities_en:
  - "Twelve days of lectures on core ML topics, from fundamentals to current research"
  - "Networking with about 200 graduate students from around the world"
benefits:
  - "분야 대표 연구자에게 직접 배우는 집중 과정"
  - "국제 ML 연구자 네트워크"
benefits_en:
  - "An intensive course taught directly by leading researchers"
  - "An international network of ML researchers"
commitment: "2027년 3월 1–12일(12일간) 오키나와 현장 참가"
commitment_en: "Twelve days on site in Okinawa, March 1–12, 2027"
