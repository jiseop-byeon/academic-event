eligibility:
  international_ok: true
  ut_only: false
  notes: "ML 기술 배경이 탄탄한 석·박사생이 주 대상이며 뛰어난 학부생·교수·연구자·산업계 인력도 일부 선발. 파이썬과 선형대수·미적분·확률·통계 기초가 필요하고, 해외 지원자를 환영한다고 명시. 지원 마감·참가비는 아직 공식 페이지에 없음."
  notes_en: "Mainly for master's and PhD students with strong technical ML backgrounds, with a limited number of exceptional undergraduates, faculty, researchers and industry professionals. Python plus foundations in linear algebra, calculus, probability and statistics are required, and international applicants are explicitly welcome. The application deadline and fees are not yet on the official page."
cycle:
  typical: "시리즈 전체로는 매년 1–3회 여러 대륙에서 개최 — 오키나와 회차는 2024년(3/4–15)에 이어 2027년(3/1–12) 개최"
  typical_en: "As a series, one to three schools a year on different continents — the Okinawa edition follows 2024 (Mar 4–15) with 2027 (Mar 1–12)"
