take: "노변 LiDAR·AR 보행자 안전 같은 교통 연구를 보여 줄 곳이니 11/18 조기 학생 등록으로 2027 총회에 가고, 관심 상임위원회(예: 자동화·안전 분야)에 Friend로 등록해 위원회 회의부터 얼굴을 알려라."
take_en: "A venue for transportation work such as roadside LiDAR and AR pedestrian safety — register by the Nov 18 student early-bird for the 2027 meeting and sign up as a Friend of relevant standing committees (for example automation or safety) to start showing up at their meetings."
