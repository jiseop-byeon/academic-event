fit: 1
take: "ATI 주력 분야(에너지·모빌리티·물 등)는 건설 로봇과 거리가 있으니, 연구 기술의 시장성을 확인하고 싶을 때 2027년 1월 말 Southwest I-Corps IdeaLaunch 기수부터 검토하라."
take_en: "ATI's focus sectors (energy, mobility, water and others) are far from construction robotics — when you want to test the market for a research technology, look first at the late-January 2027 Southwest I-Corps IdeaLaunch cohort."
