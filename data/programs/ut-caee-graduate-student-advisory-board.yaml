fit: 2
take: "같은 CEPM·토목 대학원 선배를 만나는 가장 빠른 길이니 GsAB 동료 멘토링에 신청하고, Industry Open House에는 건설 로봇 연구를 소개할 이력서를 들고 가라."
take_en: "The fastest way to meet senior CEPM and civil graduate students — sign up for GsAB peer mentoring, and bring a resume that presents your construction-robotics work to the Industry Open House."
