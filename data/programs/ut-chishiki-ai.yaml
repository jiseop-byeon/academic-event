fit: 3
take: "토목 소속 박사생이 건설 자동화·로보틱스 AI로 받을 수 있는 드문 유학생 지원 가능 펠로십인데 NSF 지원이 2028년 8월에 끝나 2027–28년이 마지막 회차일 수 있으니, 2027년 3월 기준 2학기 이수 조건을 채우는지 지금 확인하고 회원 등록·웨비나로 커뮤니티에 먼저 이름을 알려 둬라."
take_en: "A rare fellowship open to international PhD students for AI in construction automation and robotics within civil engineering, but the NSF award ends in August 2028, so 2027–28 may be the last round — check now whether you meet the two-full-semesters-by-March-2027 rule, and register as a member and join the webinars in the meantime."
