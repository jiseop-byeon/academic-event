id: ut-construction-industry-institute
name: "Construction Industry Institute (CII)"
organizer: "Construction Industry Institute, The University of Texas at Austin"
scope: ut-austin
kind: research-community
audience: [phd, ms]
fields: [construction]
summary: "UT Austin에 본부를 둔 자본 프로젝트(플랜트·인프라·건설) 산업의 연구개발 컨소시엄으로, 120개 이상의 발주처·EPC·서비스 기업이 40년 넘게 함께 연구해 17개 베스트 프랙티스와 PDRI, Advanced Work Packaging(AWP) 같은 도구를 만들었다. 매년 회원사 실무자와 교수 연구진이 섞인 연구팀(Research Team)이 1–2년 과제를 수행하며, 학생은 연구책임자(PI) 교수의 대학원 연구조교로 참여한다. 이사회 연구 우선순위에 AI·모델 기반 수행 같은 기술 도입, 인력 개발, 건설 안전이 들어 있다. CAEE CEPM 과정의 Construction Industry Seminar 과목은 CII 직원과 산업계 리더를 초청 강사로 CII 베스트 프랙티스를 다룬다."
summary_en: "The research and development consortium of the capital-projects industry, headquartered at UT Austin: for more than four decades 120+ owners, engineering-contractor firms and service providers have produced 17 Best Practices and tools such as PDRI and Advanced Work Packaging (AWP). Each year Research Teams that mix member-company practitioners with academic researchers run one- to two-year projects, and students take part as graduate research assistants of the faculty principal investigators. The Board's research priorities include technology enablement (AI, model-based delivery), workforce development and construction safety. The CAEE CEPM program's Construction Industry Seminar course covers CII Best Practices with CII staff and visiting industry leaders as guest lecturers."
activities:
  - "CII 연구팀 과제에 PI 교수의 대학원 연구조교로 참여 — 방법론 설계, 데이터 수집·분석, 산업 위원과의 연 3–4회 팀 회의"
  - "연구 아이디어 제출 (누구나 가능)"
  - "무료 CII 웨비나 — 2026년 10월 7일 RT 421 Advanced Planning Guide for Modularization 소개·시연"
  - "연례 연구 콘퍼런스(ARC, 2026년 덴버)와 Global AWP+ Conference(2026년 11월 18–20일, 텍사스 Conroe, 유료)"
activities_en:
  - "Work as a graduate research assistant to a faculty PI on a CII Research Team — methodology, data collection and analysis, and three or four team meetings a year with industry members"
  - "Submit a research idea (open to anyone)"
  - "Free CII webinars — RT 421 Advanced Planning Guide for Modularization intro and demo on October 7, 2026"
  - "The Annual Research Conference (ARC; Denver in 2026) and the Global AWP+ Conference (November 18–20, 2026, Conroe, Texas; paid)"
benefits:
  - "120개 이상 회원사(발주처·EPC) 실무자와의 협업, 현장 데이터와 산업 문제에 대한 직접 접근"
  - "연구팀에 기여한 학생을 위한 CII Outstanding Student Award (2026년 수상자는 RT-413 대학원 연구조교)"
  - "모듈화, AWP, 안전, AI 도입 등 건설 산업의 기술 수요 파악 — 건설 로봇 연구의 동기와 평가 기준을 세우는 데 유용"
benefits_en:
  - "Collaboration with practitioners from 120+ member owners and contractors, with direct exposure to field data and industry problems"
  - "The CII Outstanding Student Award for students who contribute to a Research Team (the 2026 recipient was an RT-413 graduate research assistant)"
  - "Insight into industry technology needs — modularization, AWP, safety, AI adoption — useful for motivating and evaluating construction-robotics research"
commitment: "연구팀 과제는 보통 1–2년(연 3–4회 대면·온라인 회의), 웨비나는 1시간"
commitment_en: "Research Team projects usually run one to two years (three or four in-person and online meetings a year); webinars last an hour"
location: {city: "Austin", region: "TX", country: US, lat: 30.28, lon: -97.74}
eligibility:
  international_ok: true
  ut_only: false
  notes: "국적 제한 언급 없음. 연구팀 산업 위원은 회원사 소속이어야 하고, PI는 미국·캐나다 대학의 정년트랙 교수 중 매년 RFQ로 선정되므로, 학생은 CII 과제를 맡은 교수의 연구실을 통해 참여. 웨비나는 무료 등록, 콘퍼런스는 유료 등록."
  notes_en: "No nationality restriction is mentioned. Industry Research Team members must come from member companies and PIs are tenure-track faculty at US or Canadian universities chosen through a yearly RFQ, so students join through a faculty member's CII project. Webinars are free with registration; conferences are paid."
cycle:
  typical: "매년 1월경 교수 대상 연구 RFQ, 2월부터 연구 주제 공개와 4월 말까지 산업 위원 추천, 새 연구팀 출범; 연례 연구 콘퍼런스(2026년 덴버, 8월 초 수상자 발표); 웨비나는 수시"
  typical_en: "A research RFQ for academics around January each year; research topics announced from February with industry nominations until late April, then new Research Teams start; the Annual Research Conference (Denver in 2026, awards announced in early August); webinars throughout the year"
  deadlines:
    - {kind: event, date: 2026-10-07, label: "무료 CII 웨비나: RT 421 Advanced Planning Guide for Modularization (12–13시 CDT, 온라인)", label_en: "Free CII webinar: RT 421 Advanced Planning Guide for Modularization (12–1 p.m. CDT, online)"}
    - {kind: event, date: 2026-11-18, label: "CII Global AWP+ Conference (11월 18–20일, 텍사스 Conroe, 유료)", label_en: "CII Global AWP+ Conference (November 18–20, Conroe, Texas; paid)"}
