take: "학생 참여는 PI 교수의 연구조교 형태라 기술·AI 관련 연구팀이 생기면 지도교수와 참여를 상의하고, 그 전에는 무료 웨비나와 연구 아이디어 제출로 모듈화·AWP·안전 같은 산업 수요를 건설 로봇 연구의 동기와 평가에 연결하라."
take_en: "Students take part as a PI's research assistant, so talk with your advisor when a technology or AI Research Team forms; meanwhile use the free webinars and the research-idea form to tie industry needs such as modularization, AWP and safety to the motivation and evaluation of construction-robotics work."
