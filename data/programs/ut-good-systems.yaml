take: "윤리·신뢰 관점의 HRI와 작업자 안전 연구가 건설 로봇 연구의 사회적 영향 논리를 보강해 주니, 봄 심포지엄 포스터 세션에 참여하고 여기서 출발한 NSF 로봇 공존 센터(Center for Human and Robot Co-Adaptation)의 참여 기회를 지켜보라."
take_en: "Its HRI-with-ethics and worker-safety work strengthens the societal-impact case for construction robotics — present at the spring symposium poster session and watch for openings at the NSF Center for Human and Robot Co-Adaptation that grew out of it."
