  notes: "심포지엄과 공개 행사는 누구나 참석 가능(국적 제한 없음). 핵심 프로젝트·시드 그랜트는 UT 교수 팀 중심이며 학생은 참여 교수의 연구실을 통해 합류. 그랜드 챌린지는 2026–27학년도로 마무리되므로 이후 체제는 변동 가능."
  notes_en: "The symposium and public events are open to anyone (no nationality restriction). Core projects and seed grants are run by UT faculty teams; students join through a participating faculty member's lab. The grand challenge wraps up in 2026–27, so its structure after that may change."
cycle:
  typical: "매년 봄 심포지엄(2022년 4월 7–8일, 2025년 봄, 2026년 3월 3–4일 공동 심포지엄), 공개 강연·행사는 수시"
  typical_en: "Annual spring symposium (April 7–8, 2022; spring 2025; joint symposium March 3–4, 2026), with public talks and events through the year"
