    - {kind: event, date: 2027-03-02, label: "연례 봄 심포지엄 — 2027년 일정 미발표, 최근 패턴으로 3월 초 추정", label_en: "Annual spring symposium — 2027 date not announced; early March estimated from recent editions", estimated: true}
