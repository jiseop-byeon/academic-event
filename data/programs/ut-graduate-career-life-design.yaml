id: ut-graduate-career-life-design
name: "Graduate Office of Career and Life Design — Professional Development and Teaching for Impact"
organizer: "The University of Texas at Austin — Office of Graduate and Postdoctoral Studies (Graduate School)"
scope: ut-austin
kind: mentoring
audience: [phd, ms]
fields: [construction, robotics]
summary: "UT 대학원(Office of Graduate and Postdoctoral Studies)이 운영하는 대학원생·박사후연구원 전용 커리어·전문성 개발 허브로, 1:1 커리어 상담, 교수법 워크숍 시리즈 'Teaching for Impact', 진로 패널과 네트워킹 나이트, 기업 방문 준비, 구직 서류 워킹그룹, 온라인 자격 과정(Career Credentials)을 제공한다. UT 전체 취업 지원 조직인 Career Success(구 Texas Career Engagement)는 대학원생을 이 사무실로 안내한다. 교수법을 더 깊게 배우려면 Cockrell 공과대학의 16학점 Graduate Certificate in Engineering Education도 있다."
summary_en: "The Graduate School's career and professional-development hub for graduate students and postdocs (Office of Graduate and Postdoctoral Studies): one-on-one career advising, the 'Teaching for Impact' workshop series, career panels and networking nights, company site-visit preparation, a job-search working group and online credential programs (Career Credentials). UT's campus-wide Career Success office (formerly Texas Career Engagement) refers graduate students here. For deeper teaching preparation, the Cockrell School offers a 16-credit Graduate Certificate in Engineering Education."
activities:
  - "Teaching for Impact 워크숍 — 첫 수업 준비, 수업 설계, 토론 진행, 피드백, 티칭 스테이트먼트 작성, 공정한 채점 (2026년 가을 10/6·10/8·10/13 개최)"
  - "대학원생 전담 1:1 커리어 상담, 구직 서류 워킹그룹, 학술직 지원 서류 상담"
  - "진로 패널(예: 2026년 10월 8일 컨설팅 패널), 기업 방문 네트워킹 준비, 동문·리크루터 네트워킹 나이트"
  - "Career Credentials 온라인 자격 과정(Google Career Certificates, GenAI Academy 등), Cockrell Graduate Certificate in Engineering Education(교수 실습 6학점·티칭 포트폴리오 포함 16학점)"
activities_en:
  - "Teaching for Impact workshops — first-day preparation, lesson design, facilitating discussions, giving feedback, drafting a teaching statement, fair grading (fall 2026 sessions on Oct 6, Oct 8 and Oct 13)"
  - "One-on-one career advising for graduate students, a job-search working group, and consultations on academic application materials"
  - "Career panels (e.g., consulting panel on October 8, 2026), company site-visit networking prep, and alumni and recruiter networking nights"
  - "Career Credentials online programs (Google Career Certificates, GenAI Academy and others) and the Cockrell Graduate Certificate in Engineering Education (16 credits, including a 6-credit teaching practicum and a teaching portfolio course)"
benefits:
  - "강의·발표·멘토링에 바로 쓰는 교수법과 소통 역량 (전이 가능한 스킬 중심 설계)"
  - "학계·산업 진로 모두를 다루는 1:1 상담과 서류 피드백"
  - "Career Credentials 온라인 자격 과정 무료 수강"
benefits_en:
  - "Teaching and communication skills you can use right away in classes, talks and mentoring (built around transferable skills)"
  - "One-on-one advising and document feedback for both academic and industry paths"
  - "Free online credential courses through Career Credentials"
commitment: "워크숍은 회당 1–1.5시간, 상담은 예약제, 온라인 자격 과정은 자기 주도(Google 인증은 6개월 안에 이수, 주 10시간 미만)"
commitment_en: "Workshops take 1–1.5 hours each; advising is by appointment; online credentials are self-paced (Google certificates within six months, under 10 hours a week)"
cost: {note: "Career Credentials 온라인 과정은 UT 대학원생·박사후연구원 무료", note_en: "Career Credentials online courses are free for UT graduate students and postdocs"}
location: {city: "Austin", region: "TX", country: US, lat: 30.28, lon: -97.74}
eligibility:
  international_ok: true
  ut_only: true
  notes: "UT Austin 대학원생·박사후연구원 대상. 2026년 10월 23일 'Bridging the Gap' 워크숍은 1–2년차 1세대·유학생 대학원생을 위한 캠퍼스 자원 안내. 같은 사무실의 Discovery to Impact PhD 인턴십(시급 $21, 9개월)은 수출 통제 정보 접근 때문에 미국 시민권자·영주권자만 지원 가능."
  notes_en: "For UT Austin graduate students and postdocs. The 'Bridging the Gap' workshop on October 23, 2026 walks first-generation and international graduate students in years one and two through campus resources. The office's Discovery to Impact PhD internship ($21/hour, nine months) is limited to US citizens and permanent residents because of export-controlled information."
cycle:
  typical: "학기 중 매주 워크숍·패널(가을 Teaching for Impact 시리즈는 10월), 봄 네트워킹 나이트(2026년 2월 24일), 상담은 연중"
  typical_en: "Weekly workshops and panels during the semester (the fall Teaching for Impact series runs in October), networking nights in spring (February 24, 2026), advising year-round"
  deadlines:
    - {kind: event, date: 2026-10-06, label: "Teaching for Impact: Giving Good Feedback (16:00–17:30)", label_en: "Teaching for Impact: Giving Good Feedback (4–5:30 p.m.)"}
    - {kind: event, date: 2026-10-08, label: "Teaching for Impact: Drafting Your Teaching Statement (14:00–15:30, FAC 2.142)", label_en: "Teaching for Impact: Drafting Your Teaching Statement (2–3:30 p.m., FAC 2.142)"}
    - {kind: event, date: 2026-10-13, label: "Teaching for Impact: Grading with Clarity and Fairness (12:30–14:00)", label_en: "Teaching for Impact: Grading with Clarity and Fairness (12:30–2 p.m.)"}
    - {kind: event, date: 2026-10-23, label: "Bridging the Gap — 1세대·유학생 대학원생 전문성 개발 워크숍 (11:00–12:30, FAC 2.142)", label_en: "Bridging the Gap — professional development for first-generation and international grad students (11 a.m.–12:30 p.m., FAC 2.142)"}
status: ongoing
