fit: 2
take: "강의·발표 역량을 키우려면 10월 Teaching for Impact 워크숍을 골라 듣고, 1:1 커리어 상담과 무료 온라인 자격 과정은 필요할 때 꺼내 쓰는 자원으로 기억해 둬라."
take_en: "Pick a few October Teaching for Impact workshops to build teaching and presentation skills, and keep one-on-one advising and the free online credentials in mind as resources for when you need them."
