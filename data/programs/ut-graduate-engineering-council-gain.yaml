take: "1월 말 GAIN에서 건설 로봇 연구 포스터나 3분 발표를 하면 교수 심사위원과 공학 대학원생을 찾는 기업에 연구를 한 번에 보여줄 수 있으니, 1월 중순 초록 마감(250단어)에 맞춰 준비하라."
take_en: "A poster or 3MT talk on construction-robotics work at GAIN in late January shows your research to faculty judges and to companies recruiting engineering graduate students in one go — have the 250-word abstract ready for the mid-January deadline."
