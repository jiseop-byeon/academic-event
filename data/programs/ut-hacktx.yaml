summary: "UT Austin 학생 단체 Freetail Hackers가 매년 여는 24시간 해커톤으로, 전국의 학생이 오스틴에 모여 현장에서 프로젝트를 만들고 데모한다. 경험·전공과 무관하게 참가할 수 있고 참가비는 무료(와이파이·식사·기념품·작업 공간·상금 제공)이며, 팀은 최대 4명(현장 팀 매칭)이다. HackTX 26은 2026년 10월 24일 8시부터 25일 17시까지 UT 캠퍼스에서 대면으로 열린다 — 사전 지원은 9월 11일 마감됐지만 당일 선착순 현장 등록이 있고, 멘토와 자원봉사자도 모집한다."
summary_en: "A 24-hour hackathon run every year by the UT Austin student organization Freetail Hackers, where students from across the country come to Austin to build and demo projects on site. No experience is required and all majors are welcome; it is free (Wi-Fi, meals, swag, workspace and prizes provided), with teams of up to four and team matching on the day. HackTX 26 runs from 8 a.m. October 24 to 5 p.m. October 25, 2026, in person on the UT campus — applications closed September 11, but there is first-come walk-in registration on the day, and mentors and volunteers are recruited too."
activities:
  - "해커로 참가 — 24시간 동안 현장에서 만든 프로젝트를 데모·심사 (챌린지별 상금, 미니 이벤트)"
  - "멘토로 참여 — 학생 질문에 답하고 워크숍 제안"
  - "자원봉사자로 행사 운영 지원"
activities_en:
  - "Compete as a hacker — demo a project built on site within 24 hours (challenge prizes and mini-events)"
  - "Mentor — answer student questions and suggest workshops"
  - "Volunteer to help run the event"
benefits:
  - "짧은 시간에 프로토타입을 완성하는 경험과 상금"
  - "타 대학 학생·후원 기업과의 네트워킹"
  - "대학원생에게 맞는 멘토 경험"
benefits_en:
  - "Practice finishing a prototype fast, plus prizes"
  - "Networking with students from other universities and sponsor companies"
  - "Mentoring experience suited to graduate students"
commitment: "주말 이틀(10월 24일 8시–25일 17시), 멘토·자원봉사는 일부 시간만 가능"
commitment_en: "One weekend (8 a.m. October 24 to 5 p.m. October 25); mentors and volunteers can give part of the time"
