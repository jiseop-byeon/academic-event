fit: 2
take: "한국계 과학기술인 네트워크와 KSEA-KUSCO 장학금 지원 자격(회원 필수)을 함께 얻을 수 있으니, UT 지부 메일링 리스트에 들고 KSEA 회원 가입($15)을 봄 장학금 마감 전에 마쳐 둬라."
take_en: "It brings both a Korean American STEM network and eligibility for the KSEA-KUSCO scholarship (membership required) — join the UT chapter's mailing list and finish KSEA membership ($15) before the spring scholarship deadline."
