take: "연구실 기술을 건설·인프라 현장의 제품으로 풀어 보는 학과 내부 기회이니, 가을 정보 세션이 공지되면 McCombs 학생과 팀을 꾸려 1라운드 영상·요약서부터 준비하라."
take_en: "An in-department chance to turn lab technology into a product for construction and infrastructure sites — when the fall information session is announced, team up with McCombs students and start on the Round 1 video and executive summary."
