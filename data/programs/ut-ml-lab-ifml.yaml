fit: 2
take: "금요일 점심 IFML 세미나는 로봇 학습에 쓰이는 ML 기초(확산 모델·강화학습·강건 추정)를 따라잡는 가장 값싼 방법이니 관련 주제만 골라 듣고, 가을·봄 심포지엄에서 ML 교수진과 접점을 만들어라."
take_en: "The Friday-noon IFML seminar is the cheapest way to keep up with the ML foundations behind robot learning (diffusion models, RL, robust estimation) — pick the relevant topics and use the fall and spring symposia to meet ML faculty."
