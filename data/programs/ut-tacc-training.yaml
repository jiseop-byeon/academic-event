take: "로봇 학습·대규모 시뮬레이션을 돌리려면 TACC 자원 사용법이 기본기이니 학기 중 단기 교육으로 Slurm·GPU·병렬 프로그래밍을 익히고, 여름 Machine Learning Institute는 연구실 예산으로 참가를 검토하라."
take_en: "Knowing how to use TACC is a basic skill for robot learning and large-scale simulation — learn Slurm, GPUs and parallel programming in the semester short courses, and consider the summer Machine Learning Institute on lab funds."
