take: "건설 로봇·HRI 연구에 가장 직접 닿는 캠퍼스 커뮤니티이니, 격주 화요일 포트폴리오 세미나와 Slack·TRGS로 로봇 연구실과 산업 파트너에게 얼굴을 알리고, 3월 심포지엄 포스터 세션에서 건설 현장 적용 연구를 보여 줘라."
take_en: "The campus community closest to construction robotics and HRI — use the biweekly Tuesday portfolio seminar, Slack and TRGS to get known in the robotics labs and among industry partners, and show construction-site work at the March symposium's poster session."
