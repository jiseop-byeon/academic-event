  notes: "AAAI 회원이어야 하고, 학회 프로그램에 논문을 제출했으며 지도교수 추천서가 있어야 함. 신청이 예산을 넘으면 채택 논문이 있는 학생, 그다음 학회에 참여하는 학생을 우선. 선정자는 학회 자원봉사를 하며, 재신청자는 이전 수혜 때의 봉사·보고 의무를 이행했어야 함. 선정 통보 전에 등록하면 무료 등록 혜택을 잃고 환불되지 않음. 국적 제한 언급 없음."
  notes_en: "Must be an AAAI member, have submitted paper(s) to the conference program and have a letter from the faculty advisor. If requests exceed funds, students with an accepted technical paper come first, then students otherwise participating in the conference. Recipients volunteer at the conference, and repeat applicants must have met earlier volunteer and reporting duties. Registering before notification forfeits the free registration, with no refund. No nationality restriction mentioned."
