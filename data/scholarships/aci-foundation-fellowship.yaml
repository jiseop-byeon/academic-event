  typical: "매년 7월 1일 접수 시작, 11월 1일 마감, 2월 첫 주 결선 통보, 4월 초 최종 통보"
  typical_en: "Opens July 1 each year and closes November 1; finalists notified in the first week of February, final notification in early April"
  deadlines:
    - {kind: application, date: 2026-11-01, tz: "ET", time: "23:59", label: "지원 마감 (오후 11:59 ET)", label_en: "Application deadline (11:59 p.m. ET)"}
status: open
