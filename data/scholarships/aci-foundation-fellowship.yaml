fit: 2
take: "국적 제한 없이 미국 대학 대학원생이 지원할 수 있으니 콘크리트 시공 로봇(철근 결속·타설·표면 마감) 연구로 엮어 ACI 회원 추천을 확보한 뒤 11월 1일 마감에 지원하라."
take_en: "Open to graduate students at US universities regardless of nationality — frame a concrete-construction robotics project (rebar tying, placement, surface finishing), secure an ACI-member endorsement and apply by November 1."
