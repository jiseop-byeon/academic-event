id: amazon-ai-phd-fellowship
name: "Amazon AI PhD Fellowship"
organizer: "Amazon (at UT Austin: UT Austin–Amazon Science Hub)"
org_type: industry
type: fellowship
fields: [ml, vision, robotics]
amount:
  summary: "2년간 학비·생활비·수수료 지원 (대학당 연 $1.1M 배정, 1인당 금액은 대학별 상이) + AWS 클라우드 크레딧 + Amazon 연구자 멘토링"
  covers: ["tuition", "stipend", "fees", "research", "mentorship"]
duration: "2년 (2025–26, 2026–27 학년도)"
eligibility:
  nationality: ["any"]
  where_enrolled: "9개 파트너 대학(CMU, JHU, MIT, Stanford, UC Berkeley, UCLA, UIUC, UT Austin, UW) 박사과정 재학생"
  stage: "학년 조건 미공개 — 각 대학이 자체 기준으로 선발"
  korean_ok: true
  international_in_us_ok: true
  us_citizen_only: false
  notes: "학생 공개 지원 절차 없음 — 대학이 Amazon 가이드(실용 AI 문제에 큰 임팩트)에 따라 선발하며 UT Austin은 2025년 1기 15명 선정. 학교 내부 추천 필요 — UT Austin 내부 마감은 학과/대학원에 확인. 국적 제한 명시 없음. UT Austin–Amazon Science Hub(Cockrell 소재)는 별도로 학년도 단위 1년 Ph.D. 펠로십을 자문위원회 선발로 운영(2023·2024·2025–26 기수)하며, 2025–26 명단에 CEPM(건설) 박사과정생의 해체 현장 로봇 연구가 포함됨. 현 프로그램 재원은 2026–27 학년도까지이며 후속 기수는 미발표."
nomination: true
awards_per_year: "전국 100명 이상(9개 대학), UT Austin 15명 (2025년 1기)"
cycle:
  typical: "2025년 가을 대학별 선발 후 10월 21일 1기 발표, 2년(2025–26·2026–27) 지원 — 후속 기수 모집 미발표"
  deadlines:
