id: apple-scholars-aiml
name: "Apple Scholars in AI/ML PhD Fellowship"
organizer: "Apple (Machine Learning Research)"
org_type: industry
type: fellowship
fields: [ml, vision]
amount:
  summary: "학비·수수료(건강보험·교재 포함) 2년 전액 + 연 최대 $40,000 생활비 + 연 $5,000 연구 출장비 + Apple 연구자 멘토링"
  summary_en: "Full tuition and fees (incl. health insurance and books) for two years + stipend up to $40,000/year + $5,000/year research travel + mentoring by an Apple researcher"
  value: 45000
  currency: USD
  unit: year
  covers: ["tuition", "fees", "health-insurance", "books", "stipend", "travel", "mentorship"]
  estimated: false
duration: "2년 (2027 코호트 기준 Fall 2027–Summer 2029)"
duration_en: "2 years (2027 cohort: Fall 2027–Summer 2029)"
eligibility:
  nationality: ["any"]
  where_enrolled: "Apple이 매 사이클 초청한 대학의 박사과정 풀타임 재학생 (UT Austin은 2023·2025년 수혜자 배출)"
  where_enrolled_en: "Full-time PhD students at universities Apple invites each cycle (UT Austin had recipients in 2023 and 2025)"
  stage: "졸업까지 2–3년 남은 박사 중후반 학생 — 보통 3–4년차, 미국 대학 박사 1년차는 추천 불가"
  stage_en: "Mid-to-late PhD students with 2–3 years left before graduating — usually years 3–4; first-year PhD students at US universities cannot be nominated"
  korean_ok: true
  international_in_us_ok: true
  us_citizen_only: false
  notes: "학생 직접 지원 불가 — 초청 대학이 기관당 최대 3명(연구 분야별 1명)을 추천하며, UT Austin에서는 대학원(Office of Graduate and Postdoctoral Studies)이 추천 대상자를 선정. 학교 내부 추천 필요 — UT Austin 내부 마감은 학과/대학원에 확인. 수혜 기간 중 다른 산업체 전액 펠로십과 중복 불가. 2027 코호트 중점 분야(온디바이스·효율적 AI, AI 보안, 평가·신뢰성, Computer Use Agents, Human-Centered AI 등)에 로보틱스는 없음."
  notes_en: "No direct applications — each invited university nominates up to 3 students (one per research area); at UT Austin the Office of Graduate and Postdoctoral Studies selects the nominees. University nomination required — check the UT Austin internal deadline with the department/graduate office. Cannot be combined with another full industry fellowship during the award. The 2027 cohort's focus areas (on-device and efficient AI, AI security, evaluation and reliability, computer-use agents, human-centered AI, etc.) do not include robotics."
nomination: true
awards_per_year: "전 세계 약 20명 (2025·2026년)"
cycle:
  typical: "매년 7월–8월 초 대학 내부 마감, 8월 중순–9월 초 Apple 추천 접수, 12월경 결과 통보, 이듬해 3–4월 공개 발표"
  typical_en: "University internal deadlines in July–early August, Apple nomination window mid-August to early September, decisions around December, public announcement in March–April of the following year"
  deadlines:
    - {kind: application, date: 2026-09-08, label: "2027 코호트 Apple 추천 마감(지난 라운드)", label_en: "Apple nomination deadline for the 2027 cohort (last round)"}
    - {kind: application, date: 2027-09-07, label: "다음 라운드 Apple 추천 마감(추정)", label_en: "Next round's Apple nomination deadline (estimated)", estimated: true}
status: closed
fit: 1
take: "로보틱스가 중점 분야에 없어 우선순위가 낮으니, 3–4년차에 비전·Human-Centered AI 쪽 성과가 쌓였을 때만 학과 추천을 노려라."
take_en: "Robotics is not a focus area, so this is low priority — seek a nomination only in years 3–4 if you have built strong vision or human-centered AI results."
