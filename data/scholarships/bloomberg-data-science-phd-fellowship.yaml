amount:
  summary: "연 $45,000 생활비 + 학비 지원, 펠로십 기간 매년 여름 14주 유급 연구 인턴십(뉴욕 또는 런던) 포함"
  summary_en: "$45,000/year stipend + tuition, plus a paid 14-week summer research internship (New York or London) in each fellowship year"
  value: 45000
  currency: USD
  unit: year
  covers: ["stipend", "tuition", "internship"]
