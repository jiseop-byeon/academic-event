eligibility:
  nationality: ["any"]
  where_enrolled: "다음 학년도에 박사과정 풀타임 재학 예정인 학생"
  where_enrolled_en: "Students who will be full-time PhD students in the next academic year"
  stage: "다음 학년도 풀타임 박사과정생이면 지원 가능 — 확인한 자료(대학 펠로십 DB)에는 학년 제한이 명시돼 있지 않음, 공식 페이지에서 재확인 필요"
  stage_en: "Anyone who will be a full-time PhD student next year — the sources checked (a university fellowship database) state no year restriction; re-check on the official page"
  korean_ok: true
  international_in_us_ok: true
  us_citizen_only: false
  notes: "유학생 지원 가능(open to international applicants). 펠로십 기간 다른 기업 펠로십 중복 수혜 불가(비기업 재원은 사안별 허용). 매년 여름 14주 인턴십(뉴욕/런던) 참여가 조건. 2027–28 공모 주제: agentic AI·도구 사용, 에이전트 평가, 코드 생성, 효율적 모델, 인간–AI 협업, 검색·RAG, 요약·생성, 지식 그래프, LLM 사후학습, 멀티모달·문서 AI, 시계열·금융 AI, 신뢰 가능한 AI — 로보틱스·비전 단독 주제는 없음. 공식 페이지(bloomberg.com·techatbloomberg.com)가 자동 접속을 차단해 Bloomberg가 ACL 포털에 올린 공지와 UChicago 대학원 펠로십 DB로 확인함."
  notes_en: "Open to international applicants. Cannot be combined with another corporate fellowship during the award (non-corporate funding considered case by case). A 14-week summer internship (New York/London) each year is a condition. Topics for the 2027–28 call: agentic AI and tool use, agent evaluation, code generation, efficient models, human-AI collaboration, retrieval and RAG, summarization and generation, knowledge graphs, LLM post-training, multimodal and document AI, time series and AI for finance, trustworthy AI — no robotics or stand-alone vision topic. The official pages (bloomberg.com, techatbloomberg.com) block automated access, so details were checked via Bloomberg's announcement on the ACL Portal and the UChicago fellowship database."
