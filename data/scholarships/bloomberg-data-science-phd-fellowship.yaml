  nationality: ["any"]
  where_enrolled: "다음 학년도에 박사과정 풀타임 재학 예정인 학생"
  stage: "다음 학년도 풀타임 박사과정생이면 지원 가능 — 확인한 자료(대학 펠로십 DB)에는 학년 제한이 명시돼 있지 않음, 공식 페이지에서 재확인 필요"
  korean_ok: true
  international_in_us_ok: true
  us_citizen_only: false
  notes: "유학생 지원 가능(open to international applicants). 펠로십 기간 다른 기업 펠로십 중복 수혜 불가(비기업 재원은 사안별 허용). 매년 여름 14주 인턴십(뉴욕/런던) 참여가 조건. 연구 주제: agentic AI, LLM reasoning, code generation, human-AI interaction, information retrieval, knowledge graphs, LLM post-training, multimodal models, summarization, time-series modeling, trustworthy AI — 로보틱스·비전 단독 주제는 없음. 공식 페이지(bloomberg.com)가 자동 접속을 차단해 UChicago 대학원 펠로십 DB로 확인함."
cycle:
  typical: "대학 펠로십 DB 기준 매년 가을(10–12월) 마감 — 정확한 접수 일정은 공식 페이지에서 확인 필요"
status: upcoming
fit: 2
take: "주제가 LLM·정보검색·시계열 같은 금융 데이터과학 중심이고 매년 뉴욕/런던 14주 인턴십이 조건이라 접촉 기반 조작 연구로는 설득력이 약하니, 다른 로보틱스 펠로십보다 뒤로 미뤄라."
