fit: 3
take: "CoRL 2026(오스틴) 신청은 끝났으니, CoRL 2027 개최지·일정이 발표되면 학회 5–6주 전 마감에 맞춰 바로 신청하라 — 개최지가 멀다면 항공·숙박 지원이 특히 크다."
take_en: "The CoRL 2026 (Austin) round is over — when CoRL 2027's location and dates are announced, apply right away for the deadline 5–6 weeks before the conference; the airfare and lodging support matters most if it is far away."
