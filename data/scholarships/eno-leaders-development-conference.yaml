  where_enrolled_en: "Master's or doctoral students in a transportation-related field — nomination by a US university required"
  stage: "석·박사과정 (2026년 회차 기준 2026학년도 이후에도 재학 예정이어야 함)"
  stage_en: "Master's and PhD students (2026 cycle: must still be enrolled in the 2026 academic year or later)"
  korean_ok: true
  international_in_us_ok: true
  us_citizen_only: false
  notes: "공식 안내상 유학생도 미국 대학의 추천을 받으면 지원 가능. 본인 추천은 불가하며 학교·교수가 추천하고, 대학당 서로 다른 프로그램에서 최대 2명(예: 토목공학 1명·법학 1명). 워싱턴 DC 전 일정 참석 필수. 교통 정책 결정자·업계 리더와의 만남과 네트워킹 중심의 리더십 프로그램."
  notes_en: "Per the official page, international students may apply if nominated by a US university. No self-nominations — the school or faculty nominates, up to two students per university from different programs (e.g., one from civil engineering and one from law). Attendance for the full program in Washington, DC is required. A leadership program built around meetings and networking with transportation policymakers and industry leaders."
