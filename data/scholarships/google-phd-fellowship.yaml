fit: 2
take: "coursework를 끝내는 2년차 봄(2028년 3–4월) 학과 추천을 목표로, 로보틱스 분야가 없으니 Machine Perception/ML 축으로 제안서를 쓸 수 있도록 그 전까지 1저자 논문 2편을 확보하라."
take_en: "Target a nomination in the spring of year 2 (March–April 2028), once coursework is done; with no robotics area, have two first-author papers by then so the proposal can be framed as Machine Perception/ML."
