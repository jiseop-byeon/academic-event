id: ibm-phd-fellowship
name: "IBM PhD Fellowship Program"
organizer: "IBM Research (University Relations)"
org_type: industry
type: fellowship
fields: [ml]
amount:
  summary: "미국 대학 기준 1년 $40,000 (대학으로 지급) — 미국 외 국가는 $6,000–$25,000, IBM 인턴십은 필수 아님(지원 권장)"
  summary_en: "$40,000 for one year at US universities (paid to the university) — $6,000–$25,000 in other countries; an IBM internship is not required (but encouraged)"
  value: 40000
  currency: USD
  unit: year
  estimated: false
duration: "1년 (가을·봄 두 학기 — 2025 회차는 2025 가을–2026 봄)"
duration_en: "1 year (fall and spring semesters — the 2025 cycle covers fall 2025–spring 2026)"
eligibility:
  nationality: ["any"]
  where_enrolled: "전 세계 대학의 박사과정 풀타임 재학생 (수혜 기간 동안 같은 프로그램 유지)"
  where_enrolled_en: "Full-time PhD students at universities worldwide (must stay in the same program during the award)"
  stage: "추천 시점에 예상 졸업일까지 2년 이내인 박사과정생 (박사 후반) — 1·2년차는 사실상 불가"
  stage_en: "PhD students within two years of their expected graduation at nomination (late stage) — effectively not years 1–2"
  korean_ok: true
  international_in_us_ok: true
  us_citizen_only: false
  notes: "학생 본인 지원 불가 — IBM 초청을 받은 박사 지도교수만 추천할 수 있고 학과장 의견서가 필요(2024년 기준 학과당 최대 3명·대학당 최대 4명). 학교 내부 추천 필요 — UT Austin 내부 마감은 학과/대학원에 확인. 시민권 요건 없음(법적 확인 목적의 거주·국적 정보만 수집), 미국 제재국 출신·소재 기관 학생 제외. 같은 기간 다른 기업·기관의 유사 펠로십 수혜자는 불가(학업 장학금 제외). 2024년 중점 분야: Semiconductor Technology, Quantum Computing, AI, Hybrid Cloud for AI, Security, Responsible Computing — 로보틱스는 없음. IBM Research는 2026–27 PhD Fellowship 프로그램을 중단(pause)해 이번 학년도에는 신규 수여가 없으며, 2027년 1분기에 개편된 새 프로그램을 발표할 예정이라고 공지함."
  notes_en: "Students cannot apply — only doctoral faculty invited by IBM can nominate, with a department-head statement (2024: up to 3 per department, 4 per university). University nomination required — check the UT Austin internal deadline with the department/graduate office. No citizenship requirement (residency/citizenship information is collected only for legal compliance); students from, or at institutions in, US-embargoed countries are excluded. Holders of a comparable fellowship from another company or institution in the same period are ineligible (academic scholarships excepted). 2024 focus areas: semiconductor technology, quantum computing, AI, hybrid cloud for AI, security, responsible computing — no robotics. IBM Research has paused the 2026–27 PhD Fellowship program, so no new awards will be made this academic year; it expects to announce a new, redesigned program in the first quarter of 2027."
requirements: ["지도교수 추천·평가 의견서", "학과장 의견서", "학생 CV", "학위논문 연구 요약"]
requirements_en: ["Advisor nomination and evaluation", "Department-head statement", "Student CV", "Dissertation research summary"]
nomination: true
awards_per_year: "2024년 24명 (전 세계, UT Austin 2명 포함)"
cycle:
  typical: "2026–27 회차 중단, 2027년 1분기 새 프로그램 발표 예정. 기존에는 IBM이 초청한 교수에게만 추천 기간이 공지됨(공개 마감 없음) — 2024 회차는 8월 30일(ET) 추천 마감, 수상자는 해당 연도 4분기 확정, 그해 가을–이듬해 봄 학기분 지원"
  typical_en: "The 2026–27 cycle is paused and a new program is expected to be announced in Q1 2027. Previously the nomination window was announced only to faculty invited by IBM (no public deadline) — the 2024 cycle closed for nominations on August 30 (ET); awards are finalized in Q4 and fund that fall and the following spring"
  deadlines:
    - {kind: application, date: 2024-08-30, time: "23:59", tz: "ET", label: "2024년 IBM 추천 마감(참고)", label_en: "2024 IBM nomination deadline (reference)"}
status: closed
links:
  home: "https://research.ibm.com/university/awards/fellowships.html"
fit: 1
take: "IBM이 2026–27 회차를 중단해 지금은 지원할 길이 없고, 기존 제도도 졸업 2년 이내·초청 교수 추천제에 로보틱스가 중점 분야가 아니었으니, 2027년 1분기 새 프로그램 발표만 확인하고 박사 후반에 다시 검토하라."
take_en: "IBM has paused the 2026–27 cycle, so there is no way to apply now; the old program also required being within two years of graduation, an invited-faculty nomination and had no robotics focus — just check the new program IBM expects to announce in Q1 2027 and revisit late in the PhD."
