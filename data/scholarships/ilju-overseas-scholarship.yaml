id: ilju-overseas-scholarship
name: "일주학술문화재단 해외박사 장학 (Ilju Foundation Overseas PhD Scholarship)"
organizer: "일주학술문화재단 (Ilju Academy and Culture Foundation, 태광그룹)"
org_type: korean-foundation
type: scholarship
fields: [any]
amount:
  summary: "1인당 총 USD 120,000 (학기당 USD 15,000, 연 USD 30,000, 5년 이내 8학기) + 입학 출국·졸업 귀국 항공료, 연구보조비(최대 200만 원, 2025년 보도 기준)"
  value: 30000
  currency: USD
  unit: year
  covers: ["stipend", "travel", "research"]
duration: "5년 이내 8학기"
eligibility:
  nationality: ["KR"]
  where_enrolled: "해외 우수 대학원 박사과정(석·박사 통합과정 포함) 입학 허가를 받은 진학 예정자"
  stage: "박사과정 신입생(진학 예정자)만 지원 가능 — 이미 해외 박사과정 1년차에 재학 중이면 지원 대상이 아님"
  korean_ok: true
  international_in_us_ok: false
  us_citizen_only: false
  notes: "대한민국 국적자라면 해외 고교 졸업자도 지원 가능. 유학 국가·전공·연령 제한 없음(MBA·JD·LLM·MD·DNP·PHARM.D 등 전문직 학위 제외), 순수·기초학문 연구자 우대. 졸업 후 태광그룹 기여 등 의무 조건 없음. 면접은 대면, 장학증서 수여식 본인 참석 필수."
requirements: ["온라인 지원서", "해외 대학원 박사과정 입학허가서", "지도교수 추천서 (최대 2부)", "대면 면접"]
nomination: false
