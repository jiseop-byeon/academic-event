id: kfas-overseas-scholarship
name: "한국고등교육재단 해외유학 장학 (KFAS International Scholarship)"
organizer: "한국고등교육재단 (Korea Foundation for Advanced Studies)"
org_type: korean-foundation
type: scholarship
fields: [ml, robotics, vision]
amount:
  summary: "해외유학후보장학생으로 선발 후 재단 지원 해외대학 박사과정에 입학하면 해외유학장학생으로 전환되어 최대 5년간 학비·생활비 지원(매년 재심사); 후보 기간에는 조건부 유학후보장학금과 연수비 전액 지원 (구체 금액은 요강에 미기재)"
  covers: ["tuition", "living"]
duration: "해외유학장학생 전환 후 최대 5년 (매년 재심사)"
eligibility:
  nationality: ["KR"]
  where_enrolled: "국내·외 4년제 대학 졸업(예정)자 또는 국내·외 대학원(석사/박사) 재학생·졸업(예정)자로서 이듬해 9월 학기 해외 박사과정에 지원할 사람"
  stage: "해외 박사과정 진학 전 단계 — 해외대학 박사과정 입학 예정자 또는 재학생은 입학포기·자퇴 신분이어야 지원 가능(50기 요강)하므로 이미 해외 박사과정에 재학 중인 1년차는 사실상 지원 불가"
  korean_ok: true
  international_in_us_ok: false
  us_citizen_only: false
  notes: "선발 분야는 사회과학, 인문(사학·철학), 자연과학(물리·화학·생명과학·수학·통계), 정보통신(EE·CS)이며 토목·건설공학은 목록에 없음(목록 밖 세부 전공은 선발위원회 심의). 선발 후 1년간 국내 재단 연수 대면 참석 필수, 국외 영주권자·복수국적자도 지원 가능, 타 해외유학 장학금(박사과정)과 중복 수혜 불가. 2026년에는 해외유학후보장학생(52기) 모집 공고 없이 '해외유학워크숍(Study Abroad Workshop)' 1기(5/11–6/2 접수)를 운영해 이후 선발 방식이 바뀌었을 수 있음."
requirements: ["온라인 지원서", "대학(원) 전 학년 성적증명서", "추천서 2부", "공인영어성적 (자연과학·정보통신 TOEFL 95 / IELTS 7.0 이상)", "학업계획서 (국문 2,000자 이내)", "영문 CV"]
nomination: false
cycle:
  typical: "해외유학후보장학생은 매년 6–7월 온라인 접수(2024년 6/24–7/12, 2025년 6/23–7/18), 2024년은 7월 필기(EE)·8월 면접 후 8/23 최종 발표; 2026년은 해외유학워크숍(5/11–6/2 접수)으로 운영"
  deadlines:
    - {kind: application, date: 2025-07-18, tz: "KST", label: "51기 해외유학후보장학생 마감(참고)"}
    - {kind: other, date: 2026-06-02, tz: "KST", label: "2026 해외유학워크숍 지원 마감(참고)"}
status: upcoming
apply_url: "https://apply.kfas.or.kr/"
fit: 1
take: "이미 해외 박사과정에 재학 중이면 자퇴해야 지원할 수 있고 선발 분야(EE·CS·자연과학·사회과학)에 토목·건설공학도 없으므로 지원 대상에서 제외한다."
