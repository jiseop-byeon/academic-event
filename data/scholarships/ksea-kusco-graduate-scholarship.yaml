fit: 3
take: "한국계 대학원생이면 국적과 무관하게 지원할 수 있으니, KSEA 회원 가입($15)을 미리 해 두고 2027년 봄 접수(2026년은 3월 31일 마감)에 CV·에세이·추천서 2부로 지원하라."
take_en: "Any graduate student of Korean heritage can apply regardless of citizenship — join KSEA ($15) ahead of time and apply in the spring 2027 window (2026 closed March 31) with a CV, essay and two letters."
