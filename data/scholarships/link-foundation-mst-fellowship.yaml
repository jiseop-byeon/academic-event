id: link-foundation-mst-fellowship
name: "Link Foundation Modeling, Simulation and Training Fellowship"
organizer: "Link Foundation (program administered by Georgia Tech Research Institute)"
org_type: other
type: fellowship
fields: [ar, haptics, hri]
amount:
  summary: "1년 $35,000 (학년도·여름 생활비 용도, 대학을 통해 지급) — 2년차는 경쟁 심사로 연장 가능; 학비는 소속 학교가 면제·부담하는 것이 전제"
  summary_en: "$35,000 for one year (academic-year and summer stipend, paid through the university) — a second year is possible after competitive review; tuition is expected to be waived or covered by the institution"
  value: 35000
  currency: USD
  unit: year
  covers: ["stipend"]
duration: "1년 (7/1–이듬해 6/30), 2년차 경쟁 연장 가능"
duration_en: "1 year (July 1–June 30), with a possible competitive second year"
eligibility:
  nationality: ["any"]
  where_enrolled: "미국 또는 캐나다 대학의 박사과정 (펠로십 기간 풀타임 재학)"
  where_enrolled_en: "PhD students at US or Canadian universities (full time for the duration of the award)"
  stage: "박사과정 (candidacy에 진입해 학위논문 방향이 정해졌지만 펠로십이 의미 있을 만큼 기간이 남은 학생 우대)"
  stage_en: "PhD students (preference for those in candidacy with a defined thesis direction and enough time left for the fellowship to make a difference)"
  korean_ok: true
  international_in_us_ok: true
  us_citizen_only: false
  notes: "공식 지침상 시민권 제한 없음. 사람이 참여하는 시뮬레이션·훈련(human-in-the-loop)에 응용되는 모델링·시뮬레이션 연구가 대상이며, 훈련 효과를 검증할 연구 설계·참가자·측정 지표를 제시한 제안서를 우대하고 ML/AI를 쓰면 데이터와 검증 방법을 밝혀야 함. 최근 수혜 과제는 햅틱 훈련, AR/VR 수술 훈련, 로봇 보조 수술, 디지털 트윈 등. 펠로십 기간에는 다른 일을 하지 않고 연구에 전념해야 함."
  notes_en: "No limitations on citizenship per the official guidelines. For modeling and simulation research applicable to human-in-the-loop simulation and training; proposals that specify a study design, participants and measures of training effectiveness are preferred, and ML/AI proposals must explain their data and validation. Recent awards cover haptic training, AR/VR surgical training, robot-assisted surgery and digital twins. Fellows must work full time on their research (no outside jobs)."
requirements: ["프로젝트 요약 (100단어)", "프로젝트 설명 에세이 (500단어: 혁신성과 human-in-the-loop 시뮬레이션 적용성)", "제안서 2쪽 (목표·일정·예산) + 참고문헌 1쪽", "이력서 (candidacy 일자 포함)", "추천서 2부 (1부는 지도교수 — 풀타임 여부·candidacy 단계·학위논문 연계 확인)"]
requirements_en: ["Project summary (100 words)", "Project description essay (500 words: novelty and applicability to human-in-the-loop simulation)", "2-page proposal (objectives, timeline, budget) + 1 page of references", "Résumé (including candidacy date)", "Two recommendation letters (one from the PhD advisor confirming full-time status, candidacy stage and link to the dissertation)"]
nomination: false
cycle:
  typical: "매년 2월 말–3월 1일 마감 (2025: 2/28, 2026: 3/1 오후 11:59 ET), 5월 1일까지 통보, 6월 학교로 지급, 7/1부터 1년"
  typical_en: "Deadline at the end of February or on March 1 each year (2025: Feb 28; 2026: Mar 1, 11:59 PM ET), notification by May 1, funds sent to the school in June, fellowship year from July 1"
  deadlines:
    - {kind: application, date: 2027-03-01, tz: "ET", time: "23:59", estimated: true, label: "2027년 지원 마감(추정)", label_en: "2027 application deadline (estimated)"}
    - {kind: result, date: 2027-05-01, estimated: true, label: "선정 통보(추정)", label_en: "Notification (estimated)"}
    - {kind: application, date: 2026-03-01, tz: "ET", time: "23:59", label: "2026년 마감(참고)", label_en: "2026 deadline (reference)"}
status: upcoming
apply_url: "https://linksim.org/apply/"
fit: 2
take: "햅틱·VR 훈련과 로봇 보조 시스템 과제가 주로 선정되니, 건설 로봇 원격조작·협업 작업자 훈련처럼 사람 참여형 시뮬레이션 연구로 엮을 수 있다면 candidacy 이후 3월 1일 마감에 지원하라."
take_en: "Awards go mostly to haptic/VR training and robot-assisted systems — apply at the March 1 deadline after candidacy if you can frame your work as human-in-the-loop simulation, such as training workers to teleoperate or collaborate with construction robots."
