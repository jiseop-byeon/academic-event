id: neurips-financial-assistance
name: "NeurIPS Financial Assistance"
organizer: "Neural Information Processing Systems Foundation (NeurIPS)"
org_type: society
type: travel-grant
fields: [ml]
amount:
  summary: "2026년 기준: 무료 등록(현장 또는 온라인) + 배정 도시(시드니·애틀랜타·파리) 숙박 선결제 — 항공·현지 교통·식비·일비는 미지원"
  summary_en: "2026 terms: complimentary registration (in person or virtual) + prepaid accommodation in the assigned city (Sydney, Atlanta or Paris) — flights, local transport, meals and per diem are not covered"
  covers: ["registration", "lodging"]
duration: "NeurIPS 1회 참가 (2026: 시드니 본 행사 12/6–12, 애틀랜타·파리 위성 행사 12/9–13; 2027: 유럽, 도시·일정 미정)"
duration_en: "One NeurIPS conference (2026: Sydney main event Dec 6–12, Atlanta and Paris satellites Dec 9–13; 2027: Europe, city and dates not yet set)"
eligibility:
  nationality: ["any"]
  where_enrolled: "제한 없음"
  where_enrolled_en: "No restriction"
  stage: "누구나 지원 가능 — 채택된 NeurIPS 연구의 주요 기여자인 학생·초기 박사후연구원 우선"
  stage_en: "Anyone may apply — students and junior postdocs who are primary contributors to accepted NeurIPS work get priority"
  korean_ok: true
  international_in_us_ok: true
  us_citizen_only: false
  notes: "접근성 필요, 재정적 어려움, 첫 참가 여부, NeurIPS 봉사 등을 종합 평가하며 논문 저자가 아니거나 워크숍 등 다른 트랙 기여자도 지원 가능. NeurIPS.cc 계정과 OpenReview 프로필 ID가 필요하고 1인 1지원. 실제 참석 가능한 도시만 고르며 마감 후 변경 불가, 수상은 양도 불가. 별도로 시드니·애틀랜타 자원봉사자(약 4시간 근무 2회)는 등록비를 환불받음(숙박 미제공)."
  notes_en: "Evaluated holistically on accessibility needs, financial hardship, first-time attendance and service to NeurIPS; non-authors and contributors to workshops or other tracks may apply. Requires a NeurIPS.cc account and an OpenReview profile ID; one application per person. Choose only cities you can realistically attend — selections are final after the deadline and awards are non-transferable. Separately, volunteers in Sydney and Atlanta (two shifts of about 4 hours) get their registration refunded (no hotel)."
requirements: ["Financial Assistance 신청서 (NeurIPS.cc 계정 로그인)", "OpenReview 프로필 ID", "참석 가능 도시 선택과 불가 사유"]
requirements_en: ["Financial Assistance application (NeurIPS.cc account)", "OpenReview profile ID", "Feasible locations, with reasons for any you cannot attend"]
nomination: false
cycle:
  typical: "9월 초 오픈, 10월 초 마감, 약 8일 뒤 통보 — 2025년 9/1 오픈·10/2 마감·10/10 통보, 2026년 9/7 오픈·10/6 마감·10/14 통보. NeurIPS 2027(유럽) 일정은 미발표라 같은 패턴으로 추정"
  typical_en: "Opens in early September, closes in early October, decisions about eight days later — 2025: opened Sep 1, closed Oct 2, decisions Oct 10; 2026: opened Sep 7, closed Oct 6, decisions Oct 14. NeurIPS 2027 (Europe) dates are not announced, so the same pattern is assumed"
  deadlines:
    - {kind: application, date: 2026-10-06, tz: "AoE", time: "23:59", label: "NeurIPS 2026 신청 마감(참고)", label_en: "NeurIPS 2026 application deadline (reference)"}
    - {kind: application, date: 2027-10-04, tz: "AoE", label: "NeurIPS 2027 신청 마감 (추정)", label_en: "NeurIPS 2027 application deadline (estimated)", estimated: true}
    - {kind: result, date: 2027-10-12, tz: "AoE", label: "NeurIPS 2027 결과 통보 (추정)", label_en: "NeurIPS 2027 notification (estimated)", estimated: true}
status: upcoming
apply_url: "https://neurips.cc/"
fit: 2
take: "NeurIPS 2026 신청은 마감됐으니, NeurIPS 2027(유럽)에 채택 논문이나 워크숍 발표가 생기면 9월 초 오픈에 맞춰 신청하라 — 2026년 기준 항공비는 지원되지 않아 유럽 왕복 항공비는 따로 마련해야 한다."
take_en: "The NeurIPS 2026 round is closed — if you have an accepted paper or workshop contribution at NeurIPS 2027 (Europe), apply when it opens in early September; under the 2026 terms airfare is not covered, so budget separately for the flight to Europe."
