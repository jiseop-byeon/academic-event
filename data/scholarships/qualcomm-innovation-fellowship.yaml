take: "2027 회차 초록 접수는 10/19에 마감됐으니 지원했다면 11/3–11/11 1차 결과를 확인하고, 아니면 ECE/CS 로봇 연구실 박사생과 미리 2인 팀을 꾸려 2028 회차(2027년 가을 공고, 10월경 마감 추정)를 노려라 — UT Austin이 참여 대학이고 Physical AI·manipulation이 관심 분야다."
take_en: "The 2027 abstract round closed Oct 19 — if you applied, watch for round-1 results Nov 3–11; otherwise team up early with a PhD student in an ECE/CS robotics lab for the 2028 cycle (announced fall 2027, deadline estimated around October) — UT Austin participates and Physical AI and manipulation are areas of interest."
