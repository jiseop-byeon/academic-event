take: "UT Austin이 참여 대학이고 2027 관심 분야에 Physical AI·manipulation이 명시돼 1년차도 지원 가능하니, ECE/CS 로봇 연구실 박사생과 2인 팀을 꾸려 10월 19일 초록 마감에 바로 도전하라."
take_en: "UT Austin participates, the 2027 areas name Physical AI and manipulation, and first-years can apply — team up with a PhD student in an ECE/CS robotics lab and go for the Oct 19 abstract deadline now."
