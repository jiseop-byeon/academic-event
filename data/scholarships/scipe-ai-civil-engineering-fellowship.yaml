  notes: "시민권과 무관하게 지원 가능(FAQ 명시). 연 1–3명 선발, 평생 1회 수혜. 지도교수가 연구 계획을 확인해야 함. NSF 지원이 2028년 8월 31일에 끝나 2027–28년 펠로십이 마지막 회차일 수 있음. 응용 예시에 건설 자동화와 극한 환경 로보틱스가 명시됨."
