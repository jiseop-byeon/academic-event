id: ut-austin-kolodzey-travel-grant
name: "Kolodzey Travel Grant"
organizer: "UT Austin Fariborz Maseeh Department of Civil, Architectural and Environmental Engineering (CAEE)"
org_type: university
type: travel-grant
fields: [any]
amount:
  summary: "학회 발표 출장비 부분 지원 (금액 비공개)"
  summary_en: "Partial support for conference presentation travel (amount not published)"
  covers: ["travel"]
duration: "출장 1회"
duration_en: "One trip"
eligibility:
  nationality: ["any"]
  where_enrolled: "UT Austin CAEE 대학원 재학생"
  where_enrolled_en: "Graduate students in UT Austin CAEE"
  stage: "박사 후보(candidacy) 단계 우선, 석사과정은 드물게 선정"
  stage_en: "Doctoral candidates (post-candidacy) come first; master's students are rarely selected"
  korean_ok: true
  international_in_us_ok: true
  us_citizen_only: false
  notes: "학회에서 본인 연구를 발표하는 CAEE 대학원생 대상으로 매년 지원 가능. 지도교수가 추천 서한 또는 온라인 양식(학위논문 제목, 학회명, 참석 필요성, 졸업 예정일 등)을 제출하며, 여러 학생을 추천하면 순위를 매김. 국적 제한 언급 없음."
  notes_en: "For CAEE graduate students presenting their own research at a conference; you can apply every year. The advisor submits a letter or an online form (dissertation title, conference, why attendance matters, expected graduation date, etc.) and ranks students when recommending several. No nationality restriction mentioned."
requirements: ["온라인 신청서", "2쪽 CV", "채택된 초록·논문 (PDF)", "지도교수 추천 서한 또는 온라인 추천 양식"]
requirements_en: ["Online application", "2-page CV", "Accepted abstract or paper (PDF)", "Advisor's recommendation letter or online recommendation form"]
nomination: false
cycle:
  typical: "연 3회 — 9/30 마감(10/15–5/31 출장), 1/31 마감(3/1–9/30 출장), 5/31 마감(7/1–12/15 출장), 마감 약 2주 뒤 결과"
  typical_en: "Three rounds a year — Sep 30 deadline (travel Oct 15–May 31), Jan 31 (travel Mar 1–Sep 30), May 31 (travel Jul 1–Dec 15); results about two weeks after each deadline"
  deadlines:
    - {kind: application, date: 2027-01-31, label: "2027년 3/1–9/30 출장분 신청 마감 (ICRA 2027 포함)", label_en: "Deadline for travel Mar 1–Sep 30, 2027 (covers ICRA 2027)"}
    - {kind: result, date: 2027-02-15, estimated: true, label: "2027년 3/1–9/30 출장분 결과", label_en: "Results for travel Mar 1–Sep 30, 2027"}
    - {kind: application, date: 2027-05-31, label: "2027년 7/1–12/15 출장분 신청 마감 (IROS 2027 포함)", label_en: "Deadline for travel Jul 1–Dec 15, 2027 (covers IROS 2027)"}
    - {kind: result, date: 2027-06-15, estimated: true, label: "2027년 7/1–12/15 출장분 결과", label_en: "Results for travel Jul 1–Dec 15, 2027"}
status: open
