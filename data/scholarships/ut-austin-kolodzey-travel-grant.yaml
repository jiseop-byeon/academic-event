fit: 2
take: "박사 후보(candidacy) 우선이라 1년차에는 가능성이 낮으니 PDA를 먼저 쓰고, candidacy 진입 후 ICRA·IROS 발표 때 지도교수 추천을 받아 지원하라."
take_en: "Candidates are preferred, so chances are low in year 1 — use the PDA first, then apply with your advisor's recommendation for ICRA/IROS talks after reaching candidacy."
