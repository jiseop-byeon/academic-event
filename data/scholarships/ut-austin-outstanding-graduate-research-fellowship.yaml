take: "1년차 실적만으로는 경쟁이 어려우니 2년차에 ICRA·IROS 1저자 논문을 확보한 뒤 지도교수에게 CAEE 펠로십 위원회 추천을 요청하라 — 선정되면 1년간 $38,000 생활비와 등록금 지원을 받는다."
