id: ut-austin-outstanding-graduate-research-fellowship
name: "Outstanding Graduate Research Fellowship (University Graduate Continuing Fellowship)"
organizer: "The University of Texas at Austin — Office of Graduate and Postdoctoral Studies"
org_type: university
type: fellowship
fields: [any]
amount:
  summary: "12개월 생활비 $38,000 + 건강보험 지원 + 주(州) 거주자 기준 등록금·수수료 지원 (가을·봄 9학점, 여름 3학점); 추천됐으나 미선정 시 Graduate Recognition Award $1,000"
  value: 38000
  currency: USD
  unit: year
  covers: ["stipend", "tuition", "other"]
duration: "12개월"
eligibility:
  nationality: ["any"]
