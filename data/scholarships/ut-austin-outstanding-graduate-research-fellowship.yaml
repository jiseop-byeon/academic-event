  stage: "현 재학생 — UT 입학 이후의 실적으로 평가 (학년 제한 명시 없음)"
  korean_ok: true
  international_in_us_ok: true
  us_citizen_only: false
  notes: "학생이 직접 지원할 수 없고 학과 graduate adviser/coordinator가 대학원 온라인 시스템으로 추천해야 함. CAEE는 전공 분야별 교수로 구성된 Graduate Fellowship Committee가 추천 대상을 정하며, 이 위원회는 학과·Cockrell 펠로십(1년 $1,000–$20,000 이상)도 추천함. 심사 기준: 입학 후 주요 성과, 명확한 연구 계획, 개인 진술서, 추천서. 국적 제한 언급 없음."
requirements: ["학과 추천 (graduate adviser/coordinator)", "CV", "개인 진술서 (personal statement)", "추천서 3부 (추천인 정보 제출)"]
nomination: true
cycle:
  typical: "학과 추천 → 대학원 위원회 심사; 2026–27 추천 일정은 대학원 공지 전 (Cockrell 재학생 펠로십 결과는 보통 여름에 통보)"
status: upcoming
