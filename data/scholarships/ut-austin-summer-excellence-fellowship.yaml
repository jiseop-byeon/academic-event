  notes: "대학원 Continuing Fellowship의 하나로 학생이 직접 지원할 수 없고 학과 graduate adviser/coordinator가 Graduate Awards System으로 추천함. 교수 심사위원회가 입학 후 주요 성과, 명확한 연구 계획, 개인 진술서, 추천서를 평가. 선발 인원은 소수. 국적 제한 언급 없음. 공식 페이지 본문은 9학점 등록금이라고 적고 마감표는 3학점으로 적어 표기가 엇갈림."
  notes_en: "One of the Graduate School's continuing fellowships — students cannot apply directly; the department's graduate adviser/coordinator nominates through the Graduate Awards System. A faculty committee reviews major accomplishments since admission, a well-defined research program, the personal statement and letters. Only a limited number are awarded. No nationality restriction mentioned. The official page's text says tuition for nine hours while its deadline table says 3 credit hours."
